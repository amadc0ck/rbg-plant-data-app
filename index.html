    .filter((x) => x.words.length && x.words.every((w) => text.includes(w)))
    .sort((a, b) => b.words.length - a.words.length);
  return scored.length ? scored[0].v : null;
}

function displayValue(field, v) {
  if (v == null || (Array.isArray(v) && !v.length) || v === "") return "—";
  if (field.type === "tri") return v ? "Yes" : "No";
  if (Array.isArray(v)) return v.join(", ");
  return String(v);
}

function renderFieldInput(field, value) {
  const id = `cf-${field.f}`;
  const common = `id="${id}" data-field="${field.f}"`;
  if (field.type === "textarea") return `<textarea ${common}>${esc(value || "")}</textarea>`;
  if (field.type === "select" || field.type === "list") {
    const opts = field.type === "list" ? listValues(field.list).map((v) => [v, v]) : field.options;
    const extra = value && !opts.some(([v]) => v === value) ? [[value, `${value} (not in list)`]] : [];
    return `<select class="input" ${common}><option value="">—</option>${[...opts, ...extra].map(([v, l]) => `<option value="${attr(v)}" ${v === value ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  }
  if (field.type === "tri") {
    const cur = value === true ? "true" : value === false ? "false" : "";
    return `<select class="input" ${common}><option value="" ${cur === "" ? "selected" : ""}>Unknown</option><option value="true" ${cur === "true" ? "selected" : ""}>Yes</option><option value="false" ${cur === "false" ? "selected" : ""}>No</option></select>`;
  }
  if (field.type === "multi") {
    const cur = Array.isArray(value) ? value : [];
    return `<div class="checks" ${common}>${listValues(field.list).map((v) => `<label><input type="checkbox" data-multi="${field.f}" value="${attr(v)}" ${cur.includes(v) ? "checked" : ""}> ${esc(v)}</label>`).join("")}</div>`;
  }
  return `<input class="input" type="${field.type === "number" ? "number" : "text"}" ${common} value="${attr(value == null ? "" : value)}">`;
}

function readFieldValue(field) {
  if (field.type === "multi") {
    const order = listValues(field.list);
    return [...document.querySelectorAll(`input[data-multi="${field.f}"]:checked`)].map((c) => c.value).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  }
  const el = document.getElementById(`cf-${field.f}`);
  if (!el) return undefined;
  if (field.type === "tri") return el.value === "" ? null : el.value === "true";
  if (field.type === "number") return el.value === "" ? null : Number.parseInt(el.value, 10);
  return norm(el.value);
}

function provenanceLine(prov) {
  if (!prov) return "";
  return `from ${esc(PROVENANCE_LABELS[prov.source] || prov.source)}${prov.by ? ` · ${esc(shortEmail(prov.by))}` : ""}${prov.at ? ` · ${esc(fmtDate(prov.at))}` : ""}`;
}

function renderCuratedTab(p) {
  const t = p.taxon || {};
  const sugg = curatedSuggestions(p);
  const provenance = t.provenance || {};
  const fieldHtml = (field) => {
    const value = field.f === "display_name" ? (t.display_name || p.displayName) : t[field.f];
    const suggestions = (sugg[field.f] || []).filter((s) => s.raw != null || JSON.stringify(s.value) !== JSON.stringify(value == null ? null : value));
    return `<div class="field">
      <label class="lbl" for="cf-${field.f}">${esc(field.label)}</label>
      ${renderFieldInput(field, value)}
      ${suggestions.map((s) => s.raw != null
        ? `<div class="sugg"><span class="src">${esc(SOURCE_LABELS[s.source])}:</span><span class="val">“${esc(s.raw)}” — not a list value; pick the closest</span></div>`
        : `<div class="sugg"><span class="src">${esc(PROVENANCE_LABELS[s.source])}:</span><span class="val">${esc(displayValue(field, s.value))}${s.label ? ` <span class="faint">(${esc(s.label)})</span>` : ""}</span>
            <button class="btn small" data-action="use-sugg" data-field="${field.f}" data-value="${attr(JSON.stringify(s.value))}" data-source="${attr(s.source)}" data-record="${attr(s.recordId || "")}">Use</button></div>`).join("")}
      ${field.f === "conservation_status" ? `<div class="faint" style="margin-top:3px"><a href="https://www.iucnredlist.org/search?query=${encodeURIComponent([t.genus, t.species].filter(Boolean).join(" ") || p.displayName)}&searchType=species" target="_blank" rel="noopener">Look up on the IUCN Red List ↗</a></div>` : ""}
      <div class="prov" id="prov-${field.f}">${provenanceLine(provenance[field.f])}</div>
    </div>`;
  };
  // Half-width fields pair up two per row.
  const rows = [];
  for (let i = 0; i < CURATED_FIELDS.length; i++) {
    const f = CURATED_FIELDS[i];
    if (f.half && CURATED_FIELDS[i + 1] && CURATED_FIELDS[i + 1].half) { rows.push(`<div class="grid2">${fieldHtml(f)}${fieldHtml(CURATED_FIELDS[i + 1])}</div>`); i++; }
    else rows.push(fieldHtml(f));
  }
  return `${renderPanelDupes(p)}${renderNameCheck(p)}${renderNamesSection(p)}
    <div class="section"><div class="row-between"><h3>Curated record</h3>
      <span class="faint">${p.taxon ? `Last edited ${esc(fmtDate(t.updated_at))}${t.updated_by ? ` by ${esc(shortEmail(t.updated_by))}` : ""}` : "Not curated yet — saving creates the record"}</span></div>
      <form id="curated-form" data-key="${attr(p.key)}" autocomplete="off">${rows.join("")}
        <div class="save-bar"><button type="submit" class="btn primary">${p.taxon ? "Save changes" : "Create curated record"}</button>
          <span class="faint" id="curated-status"></span><span style="flex:1"></span>
          ${p.taxon && state.me?.is_admin ? `<button type="button" class="btn small danger" data-action="delete-taxon">Delete curated record</button>` : ""}</div>
      </form></div>
    ${renderAccessionsSection(p)}
    <div class="section"><h3>Bloom history (${p.appearances.length})</h3>${editionsList(p)}</div>`;
}

function useSuggestion(btn) {
  const field = CURATED_FIELDS.find((f) => f.f === btn.dataset.field);
  const value = JSON.parse(btn.dataset.value);
  if (field.type === "multi") {
    document.querySelectorAll(`input[data-multi="${field.f}"]`).forEach((c) => { c.checked = value.includes(c.value); });
  } else {
    const el = document.getElementById(`cf-${field.f}`);
    el.value = field.type === "tri" ? String(value) : value;
  }
  const holder = document.getElementById(`cf-${field.f}`);
  // Remember the source; saveCurated honours it only if the value is still
  // exactly what was suggested at save time.
  holder.dataset.provSource = btn.dataset.source;
  holder.dataset.provRecord = btn.dataset.record;
  holder.dataset.provValue = JSON.stringify(readFieldValue(field));
  holder.classList.add("dirty");
  const prov = document.getElementById(`prov-${field.f}`);
  if (prov) prov.textContent = `will save as from ${PROVENANCE_LABELS[btn.dataset.source] || btn.dataset.source}`;
}

async function saveCurated(form) {
  const p = state.idx.plants.get(form.dataset.key);
  if (!p) return;
  const t = p.taxon;
  const patch = {};
  const provenance = { ...(t ? t.provenance || {} : {}) };
  const now = new Date().toISOString();
  for (const field of CURATED_FIELDS) {
    const value = readFieldValue(field);
    const current = t ? t[field.f] : field.f === "display_name" ? null : field.type === "multi" ? [] : null;
    if (JSON.stringify(value) === JSON.stringify(current == null ? (field.type === "multi" ? [] : null) : current)) continue;
    if (field.f === "conservation_assessed_year" && value != null && (value < 1960 || value > 2100)) { toast("Year assessed must be between 1960 and 2100.", true); return; }
    patch[field.f] = field.type === "multi" ? (value || []) : value;
    const holder = document.getElementById(`cf-${field.f}`);
    const fromSugg = holder && holder.dataset.provSource && holder.dataset.provValue === JSON.stringify(value);
    // A new record's display name defaults to the name the app shows; only
    // an edited one counts as typed in.
    const defaultName = !t && field.f === "display_name" && value === p.displayName;
    provenance[field.f] = {
      source: fromSugg ? holder.dataset.provSource : defaultName ? "derived" : "manual",
      source_record_id: fromSugg && holder.dataset.provRecord ? Number(holder.dataset.provRecord) : null,
      by: state.me.email, at: now,
    };
  }
  const status = document.getElementById("curated-status");
  if (!Object.keys(patch).length && t) { if (status) status.textContent = "No changes to save."; return; }
  if (!patch.display_name && !t) patch.display_name = p.displayName;
  if ("display_name" in patch && blank(patch.display_name)) { toast("Display name can't be empty.", true); return; }
  if (status) status.textContent = "Saving…";
  try {
    if (t) await db.update("taxa", { id: t.id }, { ...patch, provenance });
    else await db.insert("taxa", [{ name_key: p.key, ...patch, provenance }]);
    await reloadTables("taxa");
    toast(t ? "Curated record saved." : "Curated record created.");
    renderPanel();
    renderMain();
  } catch (e) {
    if (status) status.textContent = "";
    toast(`Couldn't save: ${e.message}`, true);
  }
}

async function deleteTaxon() {
  const p = selectedPlant();
  if (!p || !p.taxon) return;
  if (!confirmAction(`Delete the curated record for “${p.displayName}”? The source records are not affected.`)) return;
  try {
    await db.remove("taxa", { id: p.taxon.id });
    await reloadTables("taxa");
    toast("Curated record deleted.");
    renderPanel(); renderMain();
  } catch (e) { toast(`Couldn't delete: ${e.message}`, true); }
}

// window.confirm is fine for a staff tool; kept behind one function so it
// can be swapped for an in-page dialog without touching callers.
function confirmAction(msg) { return window.confirm(msg); }

/* ---------- accessions & plantings ---------- */
function locationName(code) {
  const g = code && state.data.garden_locations.find((l) => l.code === code);
  return g && g.name ? g.name : "";
}

function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderAccessionsSection(p) {
  if (!p.accessions.length) {
    return `<div class="section"><h3>Accessions</h3><div class="empty">${state.data.irisbg_imports.length ? "No IrisBG accession under this name." : "No IrisBG export loaded yet."}</div></div>`;
  }
  return `<div class="section"><h3>Accessions (${p.accessions.length}) · plantings (${p.plantingCount})</h3>
    ${p.accessions.map((a) => `<div class="box">
      <div class="row-between"><div><strong>${esc(a.accession_number)}</strong> <span class="plant-sub">${esc(a.plant_name)}</span></div>
        ${a.in_latest_export ? "" : `<span class="pill gold">Not in latest IrisBG export</span>`}</div>
      <div class="kv" style="margin:6px 0">
        <div class="k">Source</div><div>${esc([a.contact_code, a.origin_name].filter(Boolean).join(" — ") || "—")}</div>
        <div class="k">Comment</div><div>${esc(a.comment || "—")}</div>
        <div class="k">IrisBG AccNoCons</div><div>${esc(a.irisbg_acc_no_cons || "—")}</div>
      </div>
      ${a._plantings.length ? `<div class="table-wrap" style="box-shadow:none;border:1px solid var(--line)"><table class="sheet"><thead><tr><th>Item</th><th>Location</th><th>Position</th><th>Count</th><th>Status</th><th>GPS</th><th></th></tr></thead><tbody>
        ${a._plantings.map((pl) => renderPlantingRow(a, pl)).join("")}</tbody></table></div>` : `<div class="faint">No plantings.</div>`}
    </div>`).join("")}</div>`;
}

function renderPlantingRow(a, pl) {
  const loc = [pl.bed, pl.sub_location].filter(Boolean).map((c) => { const n = locationName(c); return n ? `${c} (${n})` : c; }).join(" › ");
  const gps = pl.latitude != null
    ? `<a href="https://www.google.com/maps?q=${pl.latitude},${pl.longitude}" target="_blank" rel="noopener">${Number(pl.latitude).toFixed(5)}, ${Number(pl.longitude).toFixed(5)} ↗</a>`
    : "—";
  const row = `<tr><td>${esc(pl.item_qualifier)}${pl.in_latest_export ? "" : ` <span class="pill gold" title="Not in latest IrisBG export">!</span>`}</td>
    <td>${esc(loc || "—")}</td><td>${esc(pl.location_ref || "—")}</td><td>${esc(pl.specimen_count || "—")}</td>
    <td>${esc(pl.status)}</td><td>${gps}</td>
    <td><button class="btn small" data-action="edit-planting" data-id="${pl.id}">${state.editingPlanting === pl.id ? "Close" : "Edit"}</button></td></tr>`;
  if (state.editingPlanting !== pl.id) return row;
  return row + `<tr><td colspan="7"><form id="planting-form" data-id="${pl.id}" autocomplete="off">
      <div class="grid2">
        <div class="field"><label class="lbl">Status</label><select class="input" name="status">${PLANTING_STATUS.map((s) => `<option ${s === pl.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
        <div class="field"><label class="lbl">ArcGIS GlobalID</label><input class="input" name="arcgis_global_id" value="${attr(pl.arcgis_global_id || "")}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
        <div class="field"><label class="lbl">Latitude (decimal degrees)</label><input class="input" name="latitude" inputmode="decimal" value="${attr(pl.latitude ?? "")}" placeholder="37.9…"></div>
        <div class="field"><label class="lbl">Longitude (decimal degrees)</label><input class="input" name="longitude" inputmode="decimal" value="${attr(pl.longitude ?? "")}" placeholder="-122.0…"></div>
        <div class="field"><label class="lbl">Accuracy (meters)</label><input class="input" name="gps_accuracy_m" inputmode="decimal" value="${attr(pl.gps_accuracy_m ?? "")}"></div>
        <div class="field"><label class="lbl">How captured</label><select class="input" name="gps_method"><option value="">—</option>${GPS_METHODS.map(([v, l]) => `<option value="${v}" ${v === pl.gps_method ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label class="lbl">Captured at</label><input class="input" type="datetime-local" name="gps_captured_at" value="${attr(toLocalInput(pl.gps_captured_at))}"></div>
        <div class="field"><label class="lbl">Captured by</label><input class="input" name="gps_captured_by" value="${attr(pl.gps_captured_by || "")}" placeholder="${attr(state.me?.email || "")}"></div>
      </div>
      <div class="field"><label class="lbl">Notes</label><textarea name="notes">${esc(pl.notes || "")}</textarea></div>
      <div class="row-between"><span class="faint">Location, position and count come from IrisBG and are replaced by the next import. Status, GPS and notes are never touched by imports.</span>
        <span><button type="button" class="btn" data-action="edit-planting" data-id="${pl.id}">Cancel</button> <button type="submit" class="btn primary">Save planting</button></span></div>
    </form></td></tr>`;
}

async function savePlanting(form) {
  const id = Number(form.dataset.id);
  const f = new FormData(form);
  const num = (k) => { const v = String(f.get(k) || "").trim(); return v === "" ? null : Number(v); };
  const lat = num("latitude"), lon = num("longitude"), acc = num("gps_accuracy_m");
  const errors = [];
  if ((lat == null) !== (lon == null)) errors.push("Enter both latitude and longitude, or neither.");
  if (lat != null && (!Number.isFinite(lat) || lat < -90 || lat > 90)) errors.push("Latitude must be between -90 and 90.");
  if (lon != null && (!Number.isFinite(lon) || lon < -180 || lon > 180)) errors.push("Longitude must be between -180 and 180.");
  if (acc != null && (!Number.isFinite(acc) || acc < 0)) errors.push("Accuracy must be a positive number of meters.");
  const guid = String(f.get("arcgis_global_id") || "").trim().replace(/^\{|\}$/g, "");
  // ArcGIS shows GlobalIDs wrapped in braces; the column is a plain uuid.
  if (guid && !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(guid)) errors.push("ArcGIS GlobalID must look like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.");
  if (errors.length) { toast(errors.join(" "), true); return; }
  const capturedAt = String(f.get("gps_captured_at") || "");
  const patch = {
    status: f.get("status"),
    latitude: lat, longitude: lon, gps_accuracy_m: acc,
    gps_method: f.get("gps_method") || null,
    gps_captured_at: capturedAt ? new Date(capturedAt).toISOString() : null,
    gps_captured_by: norm(f.get("gps_captured_by")) || (lat != null ? state.me.email : null),
    arcgis_global_id: guid ? guid.toLowerCase() : null,
    notes: norm(f.get("notes")),
  };
  try {
    await db.update("plantings", { id }, patch);
    state.editingPlanting = null;
    await reloadTables("plantings");
    toast("Planting saved.");
    renderPanel(); renderMain();
  } catch (e) { toast(`Couldn't save planting: ${e.message}`, true); }
}

/* ==================== MERGE ACTIONS ==================== */
// Merges any number of plants into one. All rows go in one INSERT, so the
// database applies them together or not at all -- if two of them both
// have curated records, the name_merges trigger refuses the whole batch.
async function mergePlants(aliasKeys, keepKey) {
  const keep = state.idx.plants.get(keepKey);
  const aliases = [...new Set(aliasKeys)].filter((k) => k !== keepKey).map((k) => state.idx.plants.get(k)).filter(Boolean);
  if (!keep || !aliases.length) return;
  if ([keep, ...aliases].filter((pl) => pl.taxon).length > 1) {
    state.combine = { keepKey: keep.key, keys: [keep.key, ...aliases.map((a) => a.key)], back: state.view === "combine" ? "duplicates" : state.view };
    state.view = "combine";
    render();
    window.scrollTo(0, 0);
    return;
  }
  try {
    await db.insert("name_merges", aliases.map((a) => ({ alias_key: a.key, canonical_key: keep.key, alias_name: a.displayName, canonical_name: keep.displayName })), { returning: false });
    await reloadTables("name_merges", "taxa");
    if (aliases.some((a) => a.key === state.selectedKey)) state.selectedKey = keep.key;
    state.mergeQuery = "";
    state.mergePicks.clear();
    toast(aliases.length === 1 ? `Merged “${aliases[0].displayName}” into “${keep.displayName}”.` : `Merged ${aliases.length} names into “${keep.displayName}”.`);
    render();
  } catch (e) {
    toast(`Couldn't merge: ${e.message}`, true);
  }
}

async function unmerge(aliasKey) {
  const m = state.idx.mergeMap.get(aliasKey);
  if (!m || !confirmAction(`Unmerge “${m.alias_name}” from “${m.canonical_name}”? It will show as its own plant again.`)) return;
  try {
    await db.remove("name_merges", { alias_key: aliasKey });
    await reloadTables("name_merges");
    toast(`“${m.alias_name}” is its own plant again.`);
    render();
  } catch (e) { toast(`Couldn't unmerge: ${e.message}`, true); }
}

// pairs: [[keyA, keyB], ...]
async function markNotDuplicates(pairs) {
  for (const [a, b] of pairs) {
    const [x, y] = a < b ? [a, b] : [b, a];
    try {
      await db.insert("not_duplicates", [{ key_a: x, key_b: y }], { returning: false });
    } catch (e) {
      // The table's CHECK (key_a < key_b) uses the database collation, which
      // can order punctuation differently from JavaScript. Retry swapped.
      if (/check constraint|23514/i.test(e.message)) {
        try { await db.insert("not_duplicates", [{ key_a: y, key_b: x }], { returning: false }); }
        catch (e2) { toast(`Couldn't save: ${e2.message}`, true); break; }
      } else if (!/duplicate key|23505/i.test(e.message)) { toast(`Couldn't save: ${e.message}`, true); break; }
    }
  }
  await reloadTables("not_duplicates");
  render();
}

/* ==================== POSSIBLE DUPLICATES ====================
   Suggestions are computed here from canonical keys — cheap heuristics
   with a reason string each, ranked by strength. Buckets keep it far from
   O(n²): exact groupings use maps, and edit distance only compares keys
   sharing their first two letters and within two characters in length.
   ============================================================= */
/* A variegated, crested or monstrose plant is a different plant from the
   plain one ("Agave isthmensis" vs "Agave isthmensis (varieg.)") -- Amanda,
   2026-09-13. The marker appears as a cultivar ('Cristata'), a forma
   (f. cristatus) or informally ("(variegated)", "crest"). The same stems
   are also real species epithets in second position -- Aloe variegata,
   Adromischus cristatus -- so the word right after the genus never counts.
   Inside parentheses the same rule applies to a synonym ("(stapelia
   variegata)"), unless the parenthesis starts with a marker ("(crested form)").
   Colour forms are distinct too, keyed by the colours themselves, so "(white
   form)" still pairs with "(rare white-flowered form)" but not "(salmon-pink
   form)". Locality forms ("(Addo form)") are deliberately NOT markers: usually
   the same taxon, with the provenance on the accession -- Amanda wasn't sure,
   so they stay suggestions to decide one at a time. */
const COLOUR_WORDS = new Set(["white", "yellow", "orange", "red", "pink", "salmon", "peach", "apricot", "coral", "blue", "purple", "violet", "lavender", "magenta", "crimson", "scarlet", "cream", "bronze", "copper", "silver", "gold", "golden", "green", "black", "maroon"]);
const FORM_MARKERS = [["variegated", /variegat|varieg|mediopict|medio-pict|marginat/], ["crested", /crest|cristat/], ["monstrose", /monstros/]];

function formMarkers(key) {
  const found = new Set();
  const scan = (words, skipEpithet) => words.forEach((w, i) => {
    if (i === 0 && skipEpithet) return;
    if (i === 1 && skipEpithet && /^[a-z\-]+$/.test(w)) return;
    for (const [name, re] of FORM_MARKERS) if (re.test(w)) found.add(name);
    for (const part of w.split(/[^a-z]+/)) if (COLOUR_WORDS.has(part)) found.add(part);
  });
  const outside = key.replace(/\([^)]*\)/g, " ").trim().split(/\s+/);
  scan(outside, true);
  for (const m of key.matchAll(/\(([^)]*)\)/g)) {
    const words = m[1].trim().split(/\s+/);
    // Only a synonym-shaped note ("stapelia variegata", "a. candelabrum")
    // gets the epithet exemption; "(white form)" and "(peach flowers)" don't.
    const synonymShaped = words.length > 1 && (/^[a-z]\.$/.test(words[0]) ||
      (!/form|flower|leave|leaf/.test(m[1]) && !FORM_MARKERS.some(([, re]) => re.test(words[0])) && !words[0].split(/[^a-z]+/).some((w) => COLOUR_WORDS.has(w))));
    scan(words, synonymShaped);
  }
  return [...found].sort().join(",");
}

const NOT_EPITHET = new Set(["x", "sp", "sp.", "spp", "spp.", "hybrid", "cv.", "var.", "ssp.", "f.", "species", "form"]);

function boundedLevenshtein(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < rowMin) rowMin = cur[j];
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

// Suggested pairs joined into groups: if A~B and B~C, one card shows all
// three. A long chain of near-spellings can join unrelated names, which
// is why each member can be ticked off rather than merged wholesale.
function getDupes() {
  if (!state.dupes) state.dupes = groupDupes(computeDupes());
  return state.dupes;
}

function groupDupes(pairs) {
  const parent = new Map();
  const find = (k) => { while (parent.get(k) !== k) { parent.set(k, parent.get(parent.get(k))); k = parent.get(k); } return k; };
  for (const { a, b } of pairs) {
    if (!parent.has(a)) parent.set(a, a);
    if (!parent.has(b)) parent.set(b, b);
    parent.set(find(a), find(b));
  }
  const groups = new Map();
  for (const pr of pairs) {
    const root = find(pr.a);
    const g = groups.get(root) || { keys: new Set(), pairs: [], score: 0 };
    g.keys.add(pr.a); g.keys.add(pr.b); g.pairs.push(pr); g.score = Math.max(g.score, pr.score);
    groups.set(root, g);
  }
  return [...groups.values()].map((g) => {
    // Suggested name to keep: one with a curated record (merging it away
    // is refused if another member has one too), then IrisBG, then most sources.
    const members = [...g.keys].map((k) => state.idx.plants.get(k)).sort((x, y) =>
      (!!y.taxon - !!x.taxon) || (y.accessions.length > 0) - (x.accessions.length > 0) || (y.sourceCount - x.sourceCount) || x.sortName.localeCompare(y.sortName));
    return { members, pairs: g.pairs, score: g.score };
  }).sort((x, y) => (y.score - x.score) || x.members[0].sortName.localeCompare(y.members[0].sortName));
}

function computeDupes() {
  const plants = state.idx.list;
  // A name joining two plants ("aloe microstigma & gasteria batesiana
  // hybrid", "aloe x gasteria") is its own plant, never a spelling of a parent.
  const allGenera = new Set(plants.map((p) => p.key.split(" ")[0]));
  // Also two binomials glued together by the What's in Bloom PDF reader
  // ("abutilon palmeri lobelia laxiflora") -- one was merged by mistake.
  const twoPlants = (k) => {
    const bare = k.replace(/\([^)]*\)/g, " ");        // "(blue & white form)" is one plant
    if (bare.includes("/")) return false;               // "notocactus x / parodia x" is a synonym
    if (/[&+]/.test(bare)) return true;
    const t = bare.trim().split(/\s+/);
    return t.some((w, i) => i >= 1 && w !== t[0] && w.length > 3 && allGenera.has(w) && (t[i - 1] === "x" || (i >= 2 && /^[a-z][a-z\-]+$/.test(t[i + 1] || ""))));
  };
  const keys = new Set(plants.map((p) => p.key).filter((k) => !twoPlants(k)));
  const dismissed = new Set(state.data.not_duplicates.map((n) => `${n.key_a}${n.key_b}`));
  const pairs = new Map();
  const markers = new Map([...keys].map((k) => [k, formMarkers(k)]));
  const add = (a, b, score, reason) => {
    if (a === b || !keys.has(a) || !keys.has(b)) return;
    if (markers.get(a) !== markers.get(b)) return;
    const [x, y] = a < b ? [a, b] : [b, a];
    if (dismissed.has(`${x}${y}`) || dismissed.has(`${y}${x}`)) return;
    const id = `${x}${y}`;
    const e = pairs.get(id) || { a: x, b: y, score: 0, reasons: [] };
    e.score = Math.max(e.score, score);
    if (!e.reasons.includes(reason)) e.reasons.push(reason);
    pairs.set(id, e);
  };
  const groupPairs = (map, score, reasonFn) => {
    for (const group of map.values()) {
      if (group.length < 2 || group.length > 12) continue;   // a huge group is a generic word, not a duplicate
      for (let i = 0; i < group.length; i++) for (let j = i + 1; j < group.length; j++) add(group[i], group[j], score, reasonFn(group[i], group[j]));
    }
  };
  const tokens = (k) => k.split(" ");

  // (a) identical once parenthetical notes are removed
  const byBase = new Map();
  for (const k of keys) {
    if (!k.includes("(")) { (byBase.get(k) || byBase.set(k, []).get(k)).push(k); continue; }
    const base = k.replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim();
    if (base) (byBase.get(base) || byBase.set(base, []).get(base)).push(k);
  }
  groupPairs(byBase, 0.95, () => "Same name apart from a note in parentheses");

  // (b) one name's parenthetical is another plant's name (a synonym)
  for (const k of keys) {
    const genus = tokens(k)[0];
    for (const m of k.matchAll(/\(([^)]+)\)/g)) {
      let inner = m[1].trim().replace(/^(syn\.|synonym|=|formerly|aka)\s*/, "").trim();
      const abbr = inner.match(/^([a-z])\.\s+(.+)$/);
      if (abbr && genus && genus[0] === abbr[1]) inner = `${genus} ${abbr[2]}`;
      if (keys.has(inner)) add(k, inner, 0.9, `“${inner}” is given in parentheses as another name`);
    }
  }

  // (c) same genus + species, one adds words that aren't a rank, cultivar or hybrid
  const bySpecies = new Map();
  for (const k of keys) {
    const t = tokens(k.replace(/\s*\([^)]*\)\s*/g, " ").trim());
    if (t.length < 2 || !/^[a-z][a-z\-]{2,}$/.test(t[1]) || NOT_EPITHET.has(t[1])) continue;
    const gs = `${t[0]} ${t[1]}`;
    (bySpecies.get(gs) || bySpecies.set(gs, []).get(gs)).push(k);
  }
  // Tuned on the real data: "hybrid"/"crest" name a different plant, and a
  // second genus ("agave lophantha gasteria excelsa") is a Tumblr post
  // about two plants, not a spelling of one.
  const genera = new Set([...keys].map((k) => tokens(k)[0]));
  for (const group of bySpecies.values()) {
    if (group.length < 2 || group.length > 25) continue;
    for (const a of group) for (const b of group) {
      if (a === b || !b.startsWith(a + " ")) continue;
      const extra = b.slice(a.length + 1);
      // An infraspecific rank (var., subsp., f./forma, subvar., subf.) names a different taxon.
      if (/^(var\.|ssp\.|subsp\.|subvar\.|subf\.|f\.|forma\b|'|x |\(|hybrid|crest|cristat|monstros|seedling|cv\.|cultivar)/.test(extra)) continue;
      if (genera.has(tokens(extra)[0]) && tokens(extra)[0].length > 3) continue;
      add(a, b, 0.55, `Same species; “${b}” adds “${extra}”`);
    }
  }

  // (d) abbreviated genus: "a. parryi" vs "agave parryi"
  const byEpithet = new Map();
  for (const k of keys) {
    const t = tokens(k);
    if (t.length >= 2 && /^[a-z][a-z\-]+$/.test(t[0])) {
      const rest = t.slice(1).join(" ");
      (byEpithet.get(rest) || byEpithet.set(rest, []).get(rest)).push(k);
    }
  }
  for (const k of keys) {
    const m = k.match(/^([a-z])\.\s+(.+)$/);
    if (!m) continue;
    for (const full of byEpithet.get(m[2]) || []) if (full[0] === m[1]) add(k, full, 0.85, "Genus abbreviated in one name");
  }

  // (e) near-identical spelling (IrisBG has typos like "Eriogenum fasiculatum")
  const buckets = new Map();
  for (const k of keys) {
    if (k.length <= 8) continue;
    const b2 = k.slice(0, 2);
    (buckets.get(b2) || buckets.set(b2, []).get(b2)).push(k);
  }
  for (const list of buckets.values()) {
    list.sort((a, b) => a.length - b.length);
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length && list[j].length - list[i].length <= 2; j++) {
        const a = list[i], b = list[j];
        // Numbered selections ("hybrid #1" / "#2") differ by design.
        if (a.replace(/\d/g, "") === b.replace(/\d/g, "")) continue;
        const d = boundedLevenshtein(a, b, 2);
        if (d <= 2) add(a, b, d === 1 ? 0.75 : 0.65, `Spelled almost the same (${plural(d, "letter")} different)`);
      }
    }
  }

  return [...pairs.values()].sort((x, y) => (y.score - x.score) || (y.reasons.length - x.reasons.length) || x.a.localeCompare(y.a));
}

// When a curated display name hides what the sources actually call the
// plant, say so -- two plants both showing "Abutilon palmeri" got merged
// the wrong way round because nothing on screen told them apart.
function listedAs(p) {
  const s = p.spellings.get(p.key);
  const name = s && [...s.names][0];
  return name && name.trim().toLowerCase() !== p.displayName.trim().toLowerCase() ? `listed as “${name}”` : "";
}

function sourceSummary(p) {
  const parts = [];
  if (p.tumblr.length) parts.push(plural(p.tumblr.length, "Tumblr post"));
  if (p.website.length) parts.push("Plant Highlight");
  if (p.hasWib) parts.push(`What's in Bloom${p.appearances.length ? ` ×${p.appearances.length}` : ""}`);
  if (p.accessions.length) parts.push(plural(p.accessions.length, "accession"));
  return parts.join(" · ") || "no sources";
}

// scope keeps the duplicates page ("d") and the plant panel ("p") apart:
// both can show the same group at once, and radios sharing a name would
// fight over which one is checked.
function renderDupMember(p, id, keepKey, reasons) {
  const accs = p.accessions.slice(0, 4).map((a) => a.accession_number).join(", ") + (p.accessions.length > 4 ? "…" : "");
  return `<div class="side member">
    <label class="tick" title="Include in the merge"><input type="checkbox" data-dup-tick="${id}" value="${attr(p.key)}" checked></label>
    ${p.photo ? `<img loading="lazy" src="${attr(p.photo)}" alt="">` : `<div class="ph"></div>`}
    <div style="min-width:0;flex:1">
      <div class="plant-name" style="font-size:15px"><a href="#" data-action="select" data-key="${attr(p.key)}">${esc(p.displayName)}</a></div>
      <div class="faint">${esc([listedAs(p), sourceSummary(p)].filter(Boolean).join(" · "))}${p.taxon ? " · curated" : ""}</div>
      ${accs ? `<div class="faint">Accessions: ${esc(accs)}</div>` : ""}
      <div class="snippet">${esc(p.description || (p.wib[0]?.details?.native_to ? `Native to ${p.wib[0].details.native_to}` : ""))}</div>
      ${reasons.length ? `<ul class="reasons">${reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    </div>
    <div class="member-actions">
      <label class="faint"><input type="radio" name="keep-${id}" value="${attr(p.key)}" ${p.key === keepKey ? "checked" : ""}> Keep this name</label>
      <button class="btn small" data-action="not-dup-member" data-group="${id.slice(1)}" data-key="${attr(p.key)}" title="This one isn't the same plant as the others">Not part of this group</button>
    </div></div>`;
}

function groupReasons(g, k) {
  return g.pairs.filter((pr) => pr.a === k || pr.b === k).flatMap((pr) => {
    const other = state.idx.plants.get(pr.a === k ? pr.b : pr.a);
    return pr.reasons.map((r) => `${r} — vs “${other.displayName}”`);
  });
}

function curatedClash(g) {
  const n = g.members.filter((m) => m.taxon).length;
  return n > 1 ? `<div class="notice">${n} of these names have curated records. Merging them opens a side-by-side view to combine the records into one first.</div>` : "";
}

function renderDuplicates() {
  const all = getDupes();
  const q = state.dupQuery.trim().toLowerCase();
  // Keep each group's index into getDupes() -- the buttons refer to it.
  const matches = all.map((g, gi) => [g, gi]).filter(([g]) => !q || g.members.some((m) => m.haystack.includes(q)));
  const shown = matches.slice(0, state.dupLimit);
  return `<h1 class="page-title">Possible duplicates</h1>
    <p class="muted">${all.length.toLocaleString()} suggested group${all.length === 1 ? "" : "s"}, strongest first. Untick any name that isn't the same plant, choose the name to keep, then merge. Merging never changes a source record — it only tells the app and the Google Sheet to treat the names as one plant, and each name can be unmerged from the plant's Curated tab.</p>
    <div class="toolbar"><input class="input" id="dup-search" type="search" placeholder="Find a group by plant name…" value="${attr(state.dupQuery)}" autocomplete="off" style="max-width:360px">
      ${q ? `<span class="muted">${plural(matches.length, "group")} match</span>` : ""}</div>
    <div id="dup-list">${shown.map(([g, gi]) => {
      const keepKey = g.members[0].key;
      return `<div class="pair">
        <div class="row-between"><span class="pill ${g.score >= 0.85 ? "sage" : g.score >= 0.65 ? "sky" : "gold"}">${g.score >= 0.85 ? "Strong" : g.score >= 0.65 ? "Likely" : "Possible"} match</span>
          <span class="faint">${plural(g.members.length, "name")}</span></div>
        ${g.members.length === 2 ? `<ul class="reasons">${g.pairs[0].reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
        ${curatedClash(g)}
        <div class="members">${g.members.map((p) => renderDupMember(p, `d${gi}`, keepKey, g.members.length > 2 ? groupReasons(g, p.key) : [])).join("")}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn primary" data-action="merge-group" data-scope="d${gi}">Merge ticked names</button>
          <button class="btn" data-action="not-dup-group" data-group="${gi}">None of these are duplicates</button>
        </div></div>`;
    }).join("") || `<div class="empty">${q ? "No group contains that name." : "No suggestions right now."}</div>`}
    ${matches.length > shown.length ? `<div class="more"><button class="btn" data-action="more-dupes">Show more (${(matches.length - shown.length).toLocaleString()} left)</button></div>` : ""}</div>`;
}

// Top of the Curated tab: the other names in this plant's duplicate group.
function renderPanelDupes(p) {
  const all = getDupes();
  const gi = all.findIndex((g) => g.members.some((m) => m.key === p.key));
  if (gi < 0) return "";
  const g = all[gi];
  const id = `p${gi}`;
  const keepKey = g.members[0].key;
  return `<div class="section dup-panel"><h3>Possible duplicates (${g.members.length - 1})</h3>
    ${curatedClash(g)}
    ${g.members.map((m) => `<div class="dup-row">
      <input type="checkbox" data-dup-tick="${id}" value="${attr(m.key)}" checked title="Include in the merge">
      <div style="min-width:0;flex:1">${m.key === p.key ? `<strong>${esc(m.displayName)}</strong> <span class="faint">(this plant)</span>` : `<a href="#" data-action="select" data-key="${attr(m.key)}"><strong>${esc(m.displayName)}</strong></a>`}
        <div class="faint">${esc([listedAs(m), sourceSummary(m), m.taxon ? "curated" : ""].filter(Boolean).join(" · "))}</div>
        ${m.key !== p.key ? `<div class="faint">${esc(groupReasons(g, m.key).join("; "))}</div>` : ""}</div>
      <label class="faint" style="white-space:nowrap"><input type="radio" name="keep-${id}" value="${attr(m.key)}" ${m.key === keepKey ? "checked" : ""}> Keep</label>
    </div>`).join("")}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      <button class="btn small primary" data-action="merge-group" data-scope="${id}">Merge ticked names</button>
      <button class="btn small" data-action="not-dup-group" data-group="${gi}">None of these are duplicates</button>
    </div></div>`;
}

function mergeGroup(id) {
  const ticked = [...document.querySelectorAll(`input[data-dup-tick="${id}"]:checked`)].map((c) => c.value);
  const keep = document.querySelector(`input[name="keep-${id}"]:checked`)?.value;
  if (!keep || !ticked.includes(keep)) { toast("Tick the name you want to keep.", true); return; }
  if (ticked.length < 2) { toast("Tick at least two names to merge.", true); return; }
  mergePlants(ticked, keep);
}

// "Not part of this group": dismiss every suggested pair linking this plant
// to the rest, so the group re-forms without it.
function notDupMember(gi, key) {
  const g = getDupes()[gi];
  if (g) markNotDuplicates(g.pairs.filter((pr) => pr.a === key || pr.b === key).map((pr) => [pr.a, pr.b]));
}

function notDupGroup(gi) {
  const g = getDupes()[gi];
  if (g && confirmAction(`Mark all ${g.members.length} names as different plants?`)) markNotDuplicates(g.pairs.map((pr) => [pr.a, pr.b]));
}

/* ---------- combining curated records ----------
   A merge may leave only one curated record per plant (the name_merges
   trigger refuses otherwise), so merging names that each have one goes
   through here first: pick each field's value, save it onto one record,
   delete the rest, then merge. Deleting a taxon needs an admin. */
function renderCombine() {
  const c = state.combine;
  const keep = state.idx.plants.get(c.keepKey);
  const plants = c.keys.map((k) => state.idx.plants.get(k)).filter(Boolean);
  const withTaxa = plants.filter((pl) => pl.taxon).sort((a, b) => (b.key === c.keepKey) - (a.key === c.keepKey));
  if (!keep || withTaxa.length < 2) { state.combine = null; return renderDuplicates(); }
  const empty = (v) => v == null || v === "" || (Array.isArray(v) && !v.length);
  const rows = CURATED_FIELDS.map((field) => {
    const values = withTaxa.map((pl) => pl.taxon[field.f]);
    const distinct = new Set(values.filter((v) => !empty(v)).map((v) => JSON.stringify(v)));
    const pick = Math.max(0, values.findIndex((v) => !empty(v)));
    const cells = withTaxa.map((pl, i) => {
      const v = pl.taxon[field.f];
      const label = esc(displayValue(field, v));
      return `<td>${distinct.size > 1 && !empty(v)
        ? `<label><input type="radio" name="cmb-${field.f}" value="${i}" ${i === pick ? "checked" : ""}> ${label}</label>`
        : `${label}${!empty(v) && i === pick ? `<input type="hidden" name="cmb-${field.f}" value="${i}">` : ""}`}</td>`;
    }).join("");
    return `<tr class="${distinct.size > 1 ? "clash" : ""}"><th>${esc(field.label)}</th>${cells}</tr>`;
  }).join("");
  return `<h1 class="page-title">Combine curated records</h1>
    <p class="muted">Merging into “${esc(keep.displayName)}”: ${plants.map((pl) => `“${esc(pl.displayName)}”`).join(", ")}. ${withTaxa.length} of them have curated records, and a plant can only have one. Pick the value to keep wherever they differ (highlighted); fields that agree carry over as they are.</p>
    ${state.me?.is_admin ? "" : `<div class="notice bad">Combining deletes the extra records, which only an admin can do. Ask an admin to finish this merge.</div>`}
    <form id="combine-form"><div class="table-wrap"><table class="sheet combine"><thead><tr><th>Field</th>${withTaxa.map((pl) => `<th>${esc(pl.displayName)}<div class="faint">${esc([listedAs(pl), pl.key === c.keepKey ? "name being kept" : "", `edited ${fmtDate(pl.taxon.updated_at)}`].filter(Boolean).join(" · "))}</div></th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="save-bar"><button type="submit" class="btn primary" ${state.me?.is_admin ? "" : "disabled"}>Save one record and merge</button>
        <button type="button" class="btn" data-action="cancel-combine">Cancel</button></div></form>`;
}

async function saveCombine(form) {
  const c = state.combine;
  const keep = state.idx.plants.get(c.keepKey);
  const plants = c.keys.map((k) => state.idx.plants.get(k)).filter(Boolean);
  const withTaxa = plants.filter((pl) => pl.taxon).sort((a, b) => (b.key === c.keepKey) - (a.key === c.keepKey));
  const survivor = withTaxa[0].taxon;
  const patch = {}, provenance = {};
  const fd = new FormData(form);
  for (const field of CURATED_FIELDS) {
    const i = fd.get(`cmb-${field.f}`);
    const from = i == null ? null : withTaxa[Number(i)].taxon;
    patch[field.f] = from ? from[field.f] : field.type === "multi" ? [] : null;
    if (from && from.provenance && from.provenance[field.f]) provenance[field.f] = from.provenance[field.f];
  }
  if (blank(patch.display_name)) patch.display_name = keep.displayName;
  try {
    await db.update("taxa", { id: survivor.id }, { ...patch, provenance });
    for (const pl of withTaxa.slice(1)) await db.remove("taxa", { id: pl.taxon.id });
    await reloadTables("taxa");
  } catch (e) {
    toast(`Couldn't combine: ${e.message}`, true);
    await reloadTables("taxa").catch(() => {});
    render();
    return;
  }
  state.view = c.back;
  state.combine = null;
  await mergePlants(c.keys, c.keepKey);
}

/* ==================== DASHBOARD ====================
   Replaced "Incomplete records" in v1.1.0. Every number is a test over
   the derived plant index, so it costs no network and is always current
   with merges. Clicking a number lists its plants underneath.
   =================================================== */
const GAP_FIX = {
  photo: "Add photos to the Tumblr post or Plant Highlight; the bot picks them up on its next run.",
  description: "Write-ups come from Tumblr and Plant Highlights — edit them there.",
  highlight: "Plant Highlights are published on ruthbancroftgarden.org.",
  wib: "What's in Bloom data comes from the monthly PDFs and the reference sheet.",
  accession: "Accessions come from IrisBG — check the name matches, or merge it with the IrisBG spelling.",
  curated: "Open the plant and fill in its Curated tab.",
};
const hasWibFacts = (r) => ["native_to", "form_size", "sun_shade", "hardy_to"].some((k) => !blank(r.details?.[k]));

const DASH_SECTIONS = [
  { title: "Facts", tiles: [
    { id: "total", label: "Plants", test: () => true },
    { id: "all4", label: "In all 4 sources", test: (p) => p.sourceCount === 4, hint: "Tumblr, Plant Highlight, What's in Bloom and IrisBG." },
    { id: "complete", label: "Complete curated records", test: (p) => p.complete, hint: "Every curated field that applies to the plant is filled in. Open one to see what's left." },
    { id: "curated", label: "Curated records started", test: (p) => !!p.taxon },
    { id: "photo", label: "With a picture", test: (p) => !!p.photo },
    { id: "tumblr", label: "On Tumblr", test: (p) => p.tumblr.length > 0 },
    { id: "highlight", label: "With a Plant Highlight", test: (p) => !!p.highlightLink },
    { id: "wib", label: "In What's in Bloom", test: (p) => p.hasWib },
    { id: "irisbg", label: "In IrisBG", test: (p) => p.hasIris },
  ] },
  { title: "Exceptions", tiles: [
    { id: "complete-no-highlight", label: "Complete record, no Plant Highlight", test: (p) => p.complete && !p.highlightLink, hint: "Candidates for a new Plant Highlight." },
    { id: "tumblr-repeat", label: "On Tumblr 2+ times", test: (p) => p.tumblr.length > 1 },
    { id: "wib-repeat", label: "In What's in Bloom 2+ editions", test: (p) => p.appearances.length > 1 },
    { id: "wib-no-facts", label: "In a What's in Bloom PDF, no fact values", test: (p) => p.appearances.length > 0 && !p.wib.some(hasWibFacts), hint: "The facts come from the reference sheet only, which doesn't cover these yet." },
    { id: "gps", label: "Plantings without GPS", test: (p) => p.plantingCount > 0 && !p.hasGps, hint: "Open the plant, then Edit a planting under Accessions to add its GPS point." },
    { id: "name-nomatch", label: "Name matches nothing botanical", test: (p) => p.match && p.match.matched_as === "no match", hint: "Usually a spelling to fix. Open the plant and use “Find near spellings” under Name check." },
    { id: "name-synonym", label: "Name is an old synonym", test: (p) => p.match && /SYNONYM/.test(p.match.taxonomic_status || ""), hint: "GBIF knows a currently accepted name for these. Check it against the nursery catalogues before renaming — the trade often keeps the old name." },
    { id: "name-genus-only", label: "Only the genus was recognised", test: (p) => p.match && p.match.matched_as === "genus only", hint: "Normal for cultivars and hybrids; worth a look when it happens to a plain species name." },
    { id: "no-reference", label: "In no nursery catalogue", test: (p) => !p.references.length, hint: "Not listed by any of the five nurseries. Expected for rare collection plants, suspicious for a common one." },
  ] },
  { title: "Gaps", tiles: Object.entries(GAPS).map(([g, label]) => ({ id: `gap-${g}`, label, test: (p) => p.gaps.has(g), hint: GAP_FIX[g] })) },
];

function dashTile(id) {
  for (const sec of DASH_SECTIONS) for (const t of sec.tiles) if (t.id === id) return t;
  return DASH_SECTIONS[0].tiles[1];
}

/* ---------- filtering the dashboard list ----------
   The cards choose WHICH question is being asked (one at a time, her
   call); these narrow the answer. Everything is computed from the plant
   index, so filtering costs nothing and needs no round trip. */
const DASH_FILTER_DEFAULTS = {
  q: "", genus: "", family: "", source: "", curated: "", gap: "",
  status: "", nursery: "", location: "", photo: "", description: "", accession: "", gps: "",
};
const BOTANICAL_STATUS = [
  ["accepted", "Accepted name"], ["synonym", "Old synonym"], ["genus", "Genus only"],
  ["nomatch", "No botanical match"], ["unchecked", "Not checked"],
];

function botanicalStatus(p) {
  const m = p.match;
  if (!m) return "unchecked";
  if (m.matched_as === "no match") return "nomatch";
  if (/SYNONYM/.test(m.taxonomic_status || "")) return "synonym";
  if (m.matched_as === "genus only") return "genus";
  return "accepted";
}

// Every location code a plant sits in, bed and sub-location alike.
function plantLocationCodes(p) {
  const out = new Set();
  for (const a of p.accessions) for (const pl of a._plantings) {
    for (const code of [pl.bed, pl.sub_location, pl.location_code]) if (code) out.add(code);
  }
  return out;
}

function dashFilterMatch(p, f) {
  const yesNo = (want, has) => !want || (want === "yes") === !!has;
  if (f.q && !p.haystack.includes(f.q.trim().toLowerCase())) return false;
  if (f.genus && p.genus !== f.genus) return false;
  if (f.family && p.family !== f.family) return false;
  if (f.source === "tumblr" && !p.tumblr.length) return false;
  if (f.source === "website" && !p.website.length) return false;
  if (f.source === "wib" && !p.hasWib) return false;
  if (f.source === "irisbg" && !p.hasIris) return false;
  if (!yesNo(f.curated, p.taxon)) return false;
  if (f.gap && !p.gaps.has(f.gap)) return false;
  if (f.status && botanicalStatus(p) !== f.status) return false;
  if (f.nursery && !p.references.some((r) => r.source === f.nursery)) return false;
  if (f.location && !plantLocationCodes(p).has(f.location)) return false;
  if (!yesNo(f.photo, p.photo)) return false;
  if (!yesNo(f.description, p.description)) return false;
  if (!yesNo(f.accession, p.accessions.length)) return false;
  if (!yesNo(f.gps, p.hasGps)) return false;
  return true;
}

function dashFiltersActive() {
  return Object.entries(state.dashFilters).some(([k, v]) => v !== DASH_FILTER_DEFAULTS[k]);
}

function renderDashFilters() {
  const f = state.dashFilters;
  const counts = (pick) => {
    const m = new Map();
    for (const p of state.idx.list) { const v = pick(p); if (v) m.set(v, (m.get(v) || 0) + 1); }
    return [...m].sort((a, b) => a[0].localeCompare(b[0])).map(([v, n]) => [v, `${v} (${n})`]);
  };
  const locations = [...new Set(state.idx.list.flatMap((p) => [...plantLocationCodes(p)]))].sort()
    .map((c) => [c, locationName(c) ? `${c} — ${locationName(c)}` : c]);
  const yesNo = (label) => [["yes", `Has ${label}`], ["no", `No ${label}`]];
  return `<div class="toolbar">
      <input class="input" id="dash-q" type="search" placeholder="Search name, description, accession…" value="${attr(f.q)}" style="max-width:240px" autocomplete="off">
      <select data-dashf="genus">${optionList(counts((p) => p.genus), f.genus, "All genera")}</select>
      <select data-dashf="family">${optionList(counts((p) => p.family), f.family, "All families")}</select>
      <select data-dashf="source">${optionList([["tumblr", "Has Tumblr"], ["website", "Has Plant Highlight"], ["wib", "Has What's in Bloom"], ["irisbg", "Has IrisBG"]], f.source, "All sources")}</select>
      <select data-dashf="gap">${optionList(Object.entries(GAPS), f.gap, "Any completeness")}</select>
      <select data-dashf="status">${optionList(BOTANICAL_STATUS, f.status, "Any name status")}</select>
      <select data-dashf="nursery">${optionList(Object.entries(NURSERY_LABELS), f.nursery, "Any nursery")}</select>
      <select data-dashf="location" ${locations.length ? "" : "disabled title='Locations come from IrisBG plantings'"}>${optionList(locations, f.location, "All locations")}</select>
      <select data-dashf="curated">${optionList([["yes", "Curated"], ["no", "Not curated"]], f.curated, "Curated or not")}</select>
      <select data-dashf="photo">${optionList(yesNo("photo"), f.photo, "Photo or not")}</select>
      <select data-dashf="description">${optionList(yesNo("description"), f.description, "Description or not")}</select>
      <select data-dashf="accession">${optionList(yesNo("accession"), f.accession, "Accession or not")}</select>
      <select data-dashf="gps">${optionList(yesNo("GPS"), f.gps, "GPS or not")}</select>
      ${dashFiltersActive() ? `<button class="btn link" data-action="clear-dash-filters">Clear filters</button>` : ""}
    </div>`;
}

function dashList() {
  const current = dashTile(state.dashTile);
  const list = state.idx.list.filter(current.test).filter((p) => dashFilterMatch(p, state.dashFilters))
    .sort((a, b) => a.sortName.localeCompare(b.sortName));
  const shown = list.slice(0, state.dashLimit);
  const tileTotal = state.idx.list.filter(current.test).length;
  return `<div id="dash-list-body">
    <h2 class="dash-h">${esc(current.label)} · ${list.length.toLocaleString()}${list.length !== tileTotal ? ` <span class="faint">of ${tileTotal.toLocaleString()}</span>` : ""}</h2>
    ${current.hint ? `<div class="notice">${esc(current.hint)}</div>` : ""}
    ${list.length ? `<div class="table-wrap"><table class="sheet"><thead><tr><th>Plant</th><th>Sources</th><th>Gaps</th></tr></thead><tbody>
      ${shown.map((p) => `<tr class="clickable" data-action="select" data-key="${attr(p.key)}"><td class="name">${esc(p.displayName)}</td><td>${esc(sourceSummary(p))}</td>
        <td>${[...p.gaps].map((g) => `<span class="pill gold">${esc(GAPS[g])}</span>`).join(" ")}${p.taxon && !p.complete ? ` <span class="pill sky" title="${attr(p.missing.join(", "))}">${plural(p.missing.length, "curated field")} to go</span>` : ""}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">${dashFiltersActive() ? "No plants match the card and these filters together." : "No plants."}</div>`}
    ${list.length > shown.length ? `<div class="more"><button class="btn" data-action="more-dash">Show more (${(list.length - shown.length).toLocaleString()} left)</button></div>` : ""}
  </div>`;
}

function renderDashboard() {
  const plants = state.idx.list;
  const current = dashTile(state.dashTile);
  const sections = DASH_SECTIONS.map((sec) => `<h2 class="dash-h">${esc(sec.title)}</h2>
    <div class="stat-grid">${sec.tiles.map((t) => {
      const n = t.id === "total" ? plants.length : plants.reduce((c, p) => c + (t.test(p) ? 1 : 0), 0);
      return `<div class="stat clickable ${t.id === current.id ? "active" : ""}" data-action="dash-tile" data-tile="${t.id}"><div class="n">${n.toLocaleString()}</div><div class="l">${esc(t.label)}</div></div>`;
    }).join("")}</div>`).join("");
  return `<h1 class="page-title">Dashboard</h1>${sections}
    <div id="dash-list">${renderDashFilters()}${dashList()}</div>`;
}

// Only the rows are swapped while typing, so the search box keeps focus.
function refreshDashList() {
  const el = document.getElementById("dash-list-body");
  if (!el) { renderMain(); return; }
  const tmp = document.createElement("div");
  tmp.innerHTML = dashList();
  el.replaceWith(tmp.firstElementChild);
}

/* ==================== CHANGE HISTORY EXPORT ====================
   public.change_log, written by a database trigger (sql/004). It is never
   listed on screen and never synced into the local cache: it only grows,
   and the free egress budget is shared with the ABG app. Admin asks how
   many rows match, then downloads them as CSV -- rows cross the wire only
   when someone actually exports.
   ================================================================ */
const CHANGE_AREAS = [
  ["curated", "Curated records", ["taxa"]],
  ["merges", "Merges & duplicates", ["name_merges", "not_duplicates"]],
  ["collection", "Accessions, plantings, locations", ["accessions", "plantings", "garden_locations", "irisbg_imports"]],
  ["admin", "Staff & picklists", ["staff", "list_options"]],
];
const CHANGE_TABLE_LABELS = {
  taxa: "Curated record", name_merges: "Merge", not_duplicates: "Not duplicates", accessions: "Accession",
  plantings: "Planting", garden_locations: "Location", irisbg_imports: "IrisBG import", staff: "Staff", list_options: "Picklist",
};
const CHANGE_OPS = [["insert", "Created"], ["update", "Edited"], ["delete", "Deleted"]];
const EXPORT_PAGE = 1000;
const EXPORT_MAX = 50000;   // a safety rail, not a real limit: 50k rows is ~10 MB of CSV

// Column names a curated field label doesn't cover. Anything not here falls
// back to the column name with underscores as spaces.
const CHANGE_FIELD_LABELS = {
  provenance: "Where values came from", name_key: "Matching name", display_name: "Display name",
  alias_key: "Merged-away name", canonical_key: "Kept name", alias_name: "Merged-away name", canonical_name: "Kept name",
  key_a: "First name", key_b: "Second name", is_admin: "Admin", added_by: "Added by", merged_by: "Merged by",
  marked_by: "Marked by", in_latest_export: "In latest IrisBG export", item_qualifier: "Item", specimen_count: "Specimen count",
  location_code: "Location", sub_location: "Sub-location", location_ref: "Position", arcgis_global_id: "ArcGIS id",
  gps_accuracy_m: "GPS accuracy (m)", gps_method: "GPS method", gps_captured_at: "GPS captured at",
  gps_captured_by: "GPS captured by", plant_name: "Name as given", accession_number: "Accession", file_name: "File",
  summary: "Import summary", parent_code: "Parent location", sort: "Sort order", list: "Picklist",
};

// A date input gives a calendar day; the log stores an instant. Midnight
// LOCAL is the boundary a person means -- toISOString() on the bare date
// would start the day at 5pm the evening before, Pacific time.
function dayStartIso(day, addDays = 0) {
  const d = new Date(`${day}T00:00:00`);
  if (isNaN(d)) return null;
  d.setDate(d.getDate() + addDays);
  return d.toISOString();
}

function exportFilters(r) {
  const parts = [];
  const from = r.from && dayStartIso(r.from);
  const to = r.to && dayStartIso(r.to, 1);          // inclusive of the end day
  if (from) parts.push(`changed_at=gte.${from}`);
  if (to) parts.push(`changed_at=lt.${to}`);
  if (r.who) parts.push(`changed_by=eq.${encodeURIComponent(r.who)}`);
  if (r.op) parts.push(`op=eq.${r.op}`);
  const area = CHANGE_AREAS.find(([id]) => id === r.area);
  if (area) parts.push(`table_name=in.(${area[2].join(",")})`);
  if (r.q.trim()) {
    // Strip what PostgREST's or=() grammar treats as syntax.
    const like = `*${r.q.trim().replace(/[(),*"]/g, " ")}*`;
    parts.push(`or=(row_key.ilike.${like},name_key.ilike.${like})`);
  }
  return parts;
}

// Count only: PostgREST returns it in Content-Range with no rows attached,
// so answering "how much is there" costs nothing but the request.
async function countChanges(r) {
  if (DEMO) return 0;
  const res = await authedFetch(`${CONFIG.SUPABASE_URL}/rest/v1/change_log?select=id&limit=1&${exportFilters(r).join("&")}`,
    { headers: { Prefer: "count=exact" } });
  if (!res.ok) throw await pgError(res);
  await res.text();
  const range = res.headers.get("content-range") || "";
  return Number(range.split("/")[1] || 0);
}

async function fetchChangePage(r, offset) {
  const params = ["select=*", "order=changed_at.desc", `limit=${EXPORT_PAGE}`, `offset=${offset}`, ...exportFilters(r)];
  const res = await authedFetch(`${CONFIG.SUPABASE_URL}/rest/v1/change_log?${params.join("&")}`);
  if (!res.ok) throw await pgError(res);
  return res.json();
}

function changeValue(v) {
  if (v == null) return "";
  if (Array.isArray(v)) return v.join(", ");
  if (typeof v === "object") return JSON.stringify(v);
  if (typeof v === "boolean") return v ? "Yes" : "No";
  return String(v);
}

function changeLines(row) {
  return Object.entries(row.changes || {}).map(([field, d]) => {
    const label = CHANGE_FIELD_LABELS[field] || (CURATED_FIELDS.find((f) => f.f === field) || {}).label || field.replace(/_/g, " ");
    if (row.op === "insert") return `${label}: ${changeValue(d.to) || "—"}`;
    if (row.op === "delete") return `${label}: was ${changeValue(d.from) || "—"}`;
    return `${label}: ${changeValue(d.from) || "—"} → ${changeValue(d.to) || "—"}`;
  });
}

// One row per changed FIELD, not per change: that is what a spreadsheet can
// filter and pivot. The log row's own id ties the fields of one edit together.
function changeCsv(rows) {
  const cell = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const lines = [["Change id", "When", "Who", "Area", "Action", "Record", "Plant", "Field", "From", "To"].map(cell).join(",")];
  for (const row of rows) {
    const area = CHANGE_TABLE_LABELS[row.table_name] || row.table_name;
    const action = (CHANGE_OPS.find(([o]) => o === row.op) || [])[1] || row.op;
    const fields = Object.entries(row.changes || {});
    const base = [row.id, row.changed_at, row.changed_by === "system" ? "bot / SQL" : row.changed_by, area, action, row.row_key, row.name_key];
    if (!fields.length) lines.push([...base, "", "", ""].map(cell).join(","));
    for (const [field, d] of fields) {
      const label = CHANGE_FIELD_LABELS[field] || (CURATED_FIELDS.find((f) => f.f === field) || {}).label || field.replace(/_/g, " ");
      lines.push([...base, label, changeValue(d.from), changeValue(d.to)].map(cell).join(","));
    }
  }
  return "﻿" + lines.join("\r\n");
}

function downloadCsv(name, text) {
  const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function countChangeExport() {
  const r = state.changeExport;
  r.busy = true; r.error = null; r.count = null; renderMain();
  try {
    r.count = await countChanges(r);
  } catch (e) { r.error = e.message; }
  r.busy = false; renderMain();
}

async function runChangeExport() {
  const r = state.changeExport;
  if (r.busy) return;
  r.busy = true; r.error = null; r.status = "Fetching changes…"; renderMain();
  try {
    if (DEMO) throw new Error("Demo mode has no history to export.");
    const rows = [];
    for (let offset = 0; offset < EXPORT_MAX; offset += EXPORT_PAGE) {
      const page = await fetchChangePage(r, offset);
      rows.push(...page);
      r.status = `Fetched ${rows.length.toLocaleString()} change${rows.length === 1 ? "" : "s"}…`;
      renderMain();
      if (page.length < EXPORT_PAGE) break;
    }
    if (!rows.length) throw new Error("No changes match those filters.");
    const stamp = new Date().toLocaleDateString("en-CA");   // local YYYY-MM-DD
    downloadCsv(`rbg-change-history-${stamp}.csv`, changeCsv(rows));
    r.count = rows.length;
    r.status = `Downloaded ${rows.length.toLocaleString()} change${rows.length === 1 ? "" : "s"}.`;
  } catch (e) {
    r.error = e.message;
    r.status = null;
  }
  r.busy = false;
  renderMain();
}

function renderChangeExport() {
  const r = state.changeExport;
  const whoOptions = [...new Set([...state.data.staff.map((x) => x.email), "system"])].sort();
  return `<p class="muted">Download who changed what as a spreadsheet: one row per field changed, with the old and new value. Curated records, merges, accessions, plantings, locations, staff and picklists are covered. Source records from Tumblr, Plant Highlights and What's in Bloom are not logged, and history starts 16 September 2026.</p>
    <div class="toolbar">
      <label class="faint">From <input class="input" type="date" data-change-export="from" value="${attr(r.from)}"></label>
      <label class="faint">To <input class="input" type="date" data-change-export="to" value="${attr(r.to)}"></label>
      <select data-change-export="area">${optionList(CHANGE_AREAS.map(([id, label]) => [id, label]), r.area, "All areas")}</select>
      <select data-change-export="op">${optionList(CHANGE_OPS, r.op, "Created, edited or deleted")}</select>
      <select data-change-export="who">${optionList(whoOptions.map((w) => [w, w === "system" ? "bot / SQL" : w]), r.who, "Anyone")}</select>
      <input class="input" id="change-export-q" type="search" placeholder="Record or plant name contains…" value="${attr(r.q)}" style="max-width:240px">
      <button class="btn link" data-action="reset-change-export">Reset</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px">
      <button class="btn" data-action="count-changes" ${r.busy ? "disabled" : ""}>How many match?</button>
      <button class="btn primary" data-action="export-changes" ${r.busy ? "disabled" : ""}>Download CSV</button>
      <span class="faint">${esc(r.busy ? (r.status || "Working…") : r.count != null ? `${r.count.toLocaleString()} change${r.count === 1 ? "" : "s"} match these filters.` : r.status || "")}</span>
    </div>
    ${r.error ? `<div class="notice bad" style="margin-top:10px">${esc(r.error)}</div>` : ""}`;
}

/* ==================== CACHE / SYNC ====================
   Egress matters on the free Supabase plan, and source_records is ~5 MB
   of JSON. So:
   - Every table is cached in IndexedDB (per browser) and the app renders
     from the cache immediately on a return visit.
   - source_records syncs incrementally: fetch only the slim columns
     (id, synced_at) for every row, compare with the cache, then fetch full
     rows just for ids that are new or re-stamped, and drop ids that are
     gone. The bot re-stamps every row each run, so right after a bot run
     this is a full refresh; between runs it costs a few KB.
   - The small tables are re-read whole; they are tiny.
   The cache is cleared on sign-out so staff data doesn't linger on a
   shared computer. Demo mode never touches it.
   ======================================================= */
const IDB_NAME = "rbgpcm";
const IDB_STORE = "tables";
// Tables large enough to sync by change stamp, and the column that changes
// whenever a row does. taxa/accessions/plantings use updated_at (touch trigger
// on update, default now() on insert); source_records uses the bot's
// synced_at. Everything else is small enough to re-read whole.
const STAMP_COLUMN = { source_records: "synced_at", taxa: "updated_at", accessions: "updated_at", plantings: "updated_at" };
const ID_BATCH = 150;   // ids per in.(...) request, keeps URLs well under limits

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!("indexedDB" in window)) { reject(new Error("IndexedDB unavailable")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const dbh = await idbOpen();
    return await new Promise((resolve) => {
      const r = dbh.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}
async function idbSet(key, value) {
  try {
    const dbh = await idbOpen();
    await new Promise((resolve) => {
      const tx = dbh.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = resolve; tx.onerror = resolve; tx.onabort = resolve;
    });
  } catch (e) { /* cache is an optimisation; failures are silent */ }
}
async function idbClear() {
  try {
    const dbh = await idbOpen();
    await new Promise((resolve) => { const tx = dbh.transaction(IDB_STORE, "readwrite"); tx.objectStore(IDB_STORE).clear(); tx.oncomplete = resolve; tx.onerror = resolve; });
  } catch (e) {}
}

// The cache belongs to one signed-in email; anyone else starts clean.
function cacheKey(table) { return `${state.me ? state.me.email : "anon"}::${table}`; }

async function loadCachedTables() {
  let hits = 0;
  for (const t of TABLES) {
    const rows = await idbGet(cacheKey(t));
    if (rows) { state.data[t] = rows; hits++; }
  }
  return hits === TABLES.length;
}

async function syncIncremental(table) {
  const stamp = STAMP_COLUMN[table];
  const cached = state.data[table] || [];
  const byId = new Map(cached.map((r) => [r.id, r]));
  const slim = [];
  for (let offset = 0; ; offset += PAGE_SIZE) {
    const res = await authedFetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?select=id,${stamp}&order=id&limit=${PAGE_SIZE}&offset=${offset}`);
    if (!res.ok) throw await pgError(res);
    const page = await res.json();
    slim.push(...page);
    if (page.length < PAGE_SIZE) break;
  }
  const stale = slim.filter((r) => { const c = byId.get(r.id); return !c || c[stamp] !== r[stamp]; }).map((r) => r.id);
  const fresh = new Map();
  for (const ids of chunk(stale, ID_BATCH)) {
    const res = await authedFetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?select=*&id=in.(${ids.join(",")})`);
    if (!res.ok) throw await pgError(res);
    for (const r of await res.json()) fresh.set(r.id, r);
  }
  const rows = slim.map((r) => fresh.get(r.id) || byId.get(r.id)).filter(Boolean);
  return { rows, fetched: fresh.size };
}

// Pulls everything from Supabase (incrementally where possible) and
// refreshes the cache. Returns a short description for the console.
// Is the reference data we already hold still current? One row over the
// wire answers it.
async function referenceIsCurrent(table) {
  const stamp = REFERENCE_TABLES[table];
  const cached = state.data[table] || [];
  if (!cached.length) return false;
  const res = await authedFetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?select=${stamp}&order=${stamp}.desc&limit=1`);
  if (!res.ok) throw await pgError(res);
  const newest = (await res.json())[0];
  if (!newest) return true;
  const mine = cached.reduce((m, r) => (r[stamp] > m ? r[stamp] : m), "");
  return mine >= newest[stamp];
}

async function syncFromServer() {
  const notes = [];
  await Promise.all(TABLES.map(async (t) => {
    if (REFERENCE_TABLES[t]) {
      if (await referenceIsCurrent(t)) { notes.push(`${t}: unchanged`); return; }
      state.data[t] = await db.selectAll(t);
      notes.push(`${t}: ${state.data[t].length} refreshed`);
    } else if (STAMP_COLUMN[t]) {
      const r = await syncIncremental(t);
      state.data[t] = r.rows;
      notes.push(`${t}: ${r.fetched} fetched`);
    } else {
      state.data[t] = await db.selectAll(t);
    }
  }));
  buildIndex();
  for (const t of TABLES) idbSet(cacheKey(t), state.data[t]);
  return notes.join(", ");
}

/* ==================== IRISBG IMPORT ====================
   An admin picks the IrisBG .xlsx export; it is parsed in the browser
   with no library (an .xlsx is a ZIP of XML files), previewed, and only
   then written.

   The export's own header row is mostly blank ("Accession ID, Plant Name,
   , , QTY?, , , , Notes"), so columns are mapped BY POSITION to the IrisBG
   fields below. Part-way down the 8.28.26 export a row of those field
   names appears (two reports pasted together) — any such row is skipped.
   A file whose header row IS the field names is mapped by name instead.

   What an import may change is deliberately narrow:
   - accessions: IrisBG columns only; missing from the file -> flagged
     in_latest_export=false, never deleted.
   - plantings: location/position/count only. Status, GPS and notes are
     staff-owned and never sent. Missing -> flagged, never deleted.
   - source_records (source 'irisbg'): replaced, as a raw mirror of the file.
   ======================================================= */
const IRIS_FIELDS = ["ItemAccNoFull", "TaxonName", "ItemLocation", "ItemLocationRef", "ItemSpecCount", "AccNoCons", "ContactCode", "OriginName", "AccComment"];

async function unzipEntries(buffer, wanted) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  // End of central directory: signature 0x06054b50 within the last 65,557 bytes.
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("This doesn't look like an .xlsx file (no ZIP directory found).");
  const count = view.getUint16(eocd + 10, true);
  let ptr = view.getUint32(eocd + 16, true);
  const decoder = new TextDecoder();
  const out = {};
  for (let n = 0; n < count; n++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) throw new Error("Corrupt .xlsx (bad central directory).");
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);
    const name = decoder.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + commentLen;
    if (wanted && !wanted(name)) continue;
    // Sizes in the local header can be zero (data descriptor), so the
    // central directory's compressed size is the one to trust.
    const lNameLen = view.getUint16(localOffset + 26, true);
    const lExtraLen = view.getUint16(localOffset + 28, true);
    const start = localOffset + 30 + lNameLen + lExtraLen;
    const data = bytes.subarray(start, start + compSize);
    let raw;
    if (method === 0) raw = data;
    else if (method === 8) {
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      raw = new Uint8Array(await new Response(stream).arrayBuffer());
    } else throw new Error(`Unsupported compression in ${name}.`);
    out[name] = decoder.decode(raw);
  }
  return out;
}

function xmlDoc(text) { return new DOMParser().parseFromString(text, "application/xml"); }
function byLocalName(node, name) { return [...node.getElementsByTagNameNS("*", name)]; }

function columnIndex(ref) {
  const letters = String(ref || "").match(/^[A-Z]+/);
  if (!letters) return -1;
  let n = 0;
  for (const ch of letters[0]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

async function readXlsxRows(file) {
  const files = await unzipEntries(await file.arrayBuffer(), (n) => /^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/.+\.xml)$/.test(n));
  const shared = files["xl/sharedStrings.xml"]
    ? byLocalName(xmlDoc(files["xl/sharedStrings.xml"]), "si").map((si) => byLocalName(si, "t").map((t) => t.textContent).join(""))
    : [];
  // First sheet in workbook order, resolved through the relationships file.
  let sheetPath = null;
  if (files["xl/workbook.xml"] && files["xl/_rels/workbook.xml.rels"]) {
    const first = byLocalName(xmlDoc(files["xl/workbook.xml"]), "sheet")[0];
    const rid = first && (first.getAttribute("r:id") || first.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id"));
    const rel = byLocalName(xmlDoc(files["xl/_rels/workbook.xml.rels"]), "Relationship").find((r) => r.getAttribute("Id") === rid);
    if (rel) sheetPath = "xl/" + rel.getAttribute("Target").replace(/^\/?xl\//, "").replace(/^\//, "");
  }
  if (!sheetPath || !files[sheetPath]) sheetPath = Object.keys(files).filter((k) => k.startsWith("xl/worksheets/")).sort()[0];
  if (!sheetPath) throw new Error("No worksheet found in the file.");
  const rows = [];
  for (const row of byLocalName(xmlDoc(files[sheetPath]), "row")) {
    const cells = [];
    byLocalName(row, "c").forEach((c, i) => {
      const col = c.getAttribute("r") ? columnIndex(c.getAttribute("r")) : i;
      const type = c.getAttribute("t");
      const v = byLocalName(c, "v")[0];
      let value = "";
      if (type === "s") value = v ? shared[Number(v.textContent)] ?? "" : "";
      else if (type === "inlineStr") value = byLocalName(c, "t").map((t) => t.textContent).join("");
      else value = v ? v.textContent : "";
      cells[col] = value;
    });
    rows.push(Array.from(cells, (x) => (x == null ? "" : String(x).trim())));
  }
  return rows;
}

function parseIrisRows(rows) {
  const headerIdx = rows.findIndex((r) => r.some((c) => c !== ""));
  if (headerIdx < 0) throw new Error("The sheet is empty.");
  const header = rows[headerIdx];
  // Map by name when the header row carries the IrisBG field names,
  // otherwise by position (the known export layout).
  const named = IRIS_FIELDS.every((f) => header.includes(f));
  const colOf = Object.fromEntries(IRIS_FIELDS.map((f, i) => [f, named ? header.indexOf(f) : i]));
  const items = [];
  const bad = [];
  const seen = new Set();
  rows.slice(headerIdx + 1).forEach((r, i) => {
    const rowNo = headerIdx + i + 2;
    if (!r.some((c) => c !== "")) return;
    const raw = Object.fromEntries(IRIS_FIELDS.map((f) => [f, r[colOf[f]] ?? ""]));
    if (raw.ItemAccNoFull === "ItemAccNoFull") return;   // embedded field-name row
    const full = raw.ItemAccNoFull;
    const slash = full.lastIndexOf("/");
    if (!full || slash <= 0 || slash === full.length - 1) { bad.push({ rowNo, reason: `Accession ID “${full}” isn't in the form 2016-0059/1`, raw }); return; }
    if (!raw.TaxonName) { bad.push({ rowNo, reason: "No plant name", raw }); return; }
    if (seen.has(full)) { bad.push({ rowNo, reason: `Duplicate row for ${full}`, raw }); return; }
    seen.add(full);
    const loc = raw.ItemLocation.split("•").map((x) => x.trim()).filter(Boolean);
    items.push({
      full, raw,
      accession_number: full.slice(0, slash),
      item_qualifier: full.slice(slash + 1),
      plant_name: raw.TaxonName,
      location_code: norm(raw.ItemLocation),
      bed: loc[0] || null,
      sub_location: loc[1] || null,
      location_ref: norm(raw.ItemLocationRef),
      specimen_count: norm(raw.ItemSpecCount),
    });
  });
  return { items, bad, mappedBy: named ? "header names" : "column position" };
}

const ACC_COLS = ["plant_name", "irisbg_acc_no_cons", "contact_code", "origin_name", "comment"];
const PLANTING_COLS = ["location_code", "bed", "sub_location", "location_ref", "specimen_count"];

function buildImportPlan(fileName, parsed) {
  const accs = new Map();
  const conflicts = [];
  for (const it of parsed.items) {
    const a = accs.get(it.accession_number);
    const fields = {
      accession_number: it.accession_number, plant_name: it.plant_name,
      irisbg_acc_no_cons: norm(it.raw.AccNoCons), contact_code: norm(it.raw.ContactCode),
      origin_name: norm(it.raw.OriginName), comment: norm(it.raw.AccComment),
    };
    if (!a) { accs.set(it.accession_number, { fields, items: [it] }); continue; }
    a.items.push(it);
    if (a.fields.plant_name !== it.plant_name) conflicts.push(`${it.accession_number}: “${a.fields.plant_name}” vs “${it.plant_name}”`);
    // Accession-level columns: first non-empty wins.
    for (const c of ACC_COLS) if (a.fields[c] == null && fields[c] != null) a.fields[c] = fields[c];
  }
  const existingAcc = new Map(state.data.accessions.map((a) => [a.accession_number, a]));
  const existingPl = new Map(state.data.plantings.map((p) => [`${p.accession_id}/${p.item_qualifier}`, p]));
  const same = (x, y) => (x == null ? "" : String(x)) === (y == null ? "" : String(y));
  const plan = { fileName, parsed, accs, conflicts, acc: { new: 0, changed: 0, unchanged: 0, missing: 0, restored: 0 }, pl: { new: 0, changed: 0, unchanged: 0, missing: 0 } };
  for (const [num, a] of accs) {
    const ex = existingAcc.get(num);
    if (!ex) { plan.acc.new++; plan.pl.new += a.items.length; continue; }
    if (!ex.in_latest_export) plan.acc.restored++;
    if (ACC_COLS.every((c) => same(ex[c], a.fields[c]))) plan.acc.unchanged++; else plan.acc.changed++;
    for (const it of a.items) {
      const ep = existingPl.get(`${ex.id}/${it.item_qualifier}`);
      if (!ep) plan.pl.new++;
      else if (PLANTING_COLS.every((c) => same(ep[c], it[c])) && ep.in_latest_export) plan.pl.unchanged++;
      else plan.pl.changed++;
    }
  }
  const inFile = new Set(parsed.items.map((it) => it.full));
  const accById = new Map(state.data.accessions.map((a) => [a.id, a]));
  plan.acc.missing = state.data.accessions.filter((a) => a.in_latest_export && !accs.has(a.accession_number)).length;
  plan.pl.missing = state.data.plantings.filter((p) => p.in_latest_export && accById.get(p.accession_id) && !inFile.has(`${accById.get(p.accession_id).accession_number}/${p.item_qualifier}`)).length;
  return plan;
}

async function handleIrisFile(file) {
  state.importState = { phase: "reading", fileName: file.name };
  renderMain();
  try {
    const rows = await readXlsxRows(file);
    const parsed = parseIrisRows(rows);
    state.importState = { phase: "preview", fileName: file.name, rowsRead: rows.length, plan: buildImportPlan(file.name, parsed) };
  } catch (e) {
    state.importState = { phase: "error", fileName: file.name, error: e.message };
  }
  renderMain();
}

function setImportProgress(done, total, label) {
  const bar = document.getElementById("import-bar");
  const txt = document.getElementById("import-progress-label");
  if (bar) bar.style.width = `${Math.round((done / Math.max(total, 1)) * 100)}%`;
  if (txt) txt.textContent = label;
}

async function runIrisImport() {
  const st = state.importState;
  const plan = st.plan;
  const written = [];
  st.phase = "writing"; st.written = written;
  renderMain();
