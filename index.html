  const items = plan.parsed.items;
  const accList = [...plan.accs.values()];
  const steps = 3 + Math.ceil(accList.length / WRITE_BATCH) + Math.ceil(items.length / WRITE_BATCH) * 2;
  let step = 0;
  const tick = (label) => setImportProgress(++step, steps, label);
  try {
    const summary = {
      rows_read: st.rowsRead, items: items.length, accessions: accList.length, unparseable_rows: plan.parsed.bad.length,
      accessions_new: plan.acc.new, accessions_changed: plan.acc.changed, accessions_flagged_missing: plan.acc.missing,
      plantings_new: plan.pl.new, plantings_changed: plan.pl.changed, plantings_flagged_missing: plan.pl.missing,
      taxon_name_conflicts: plan.conflicts.length,
    };
    const [imp] = await db.insert("irisbg_imports", [{ file_name: plan.fileName, summary }]);
    written.push(`Import record #${imp.id} created`);
    tick("Saving accessions…");

    const accId = new Map();
    for (const batch of chunk(accList, WRITE_BATCH)) {
      const saved = await db.insert("accessions", batch.map((a) => ({ ...a.fields, in_latest_export: true, last_import_id: imp.id })), { onConflict: "accession_number" });
      saved.forEach((r) => accId.set(r.accession_number, r.id));
      tick(`Saved ${accId.size.toLocaleString()} of ${accList.length.toLocaleString()} accessions`);
    }
    written.push(`${accId.size.toLocaleString()} accessions saved`);

    const missingAcc = state.data.accessions.filter((a) => a.in_latest_export && !plan.accs.has(a.accession_number)).map((a) => a.id);
    for (const ids of chunk(missingAcc, ID_BATCH)) await db.update("accessions", { id: { in: ids } }, { in_latest_export: false });
    if (missingAcc.length) written.push(`${missingAcc.length} accessions flagged as not in this export`);
    tick("Saving plantings…");

    let plDone = 0;
    const savedPlantingIds = new Set();
    for (const batch of chunk(items, WRITE_BATCH)) {
      const saved = await db.insert("plantings", batch.map((it) => ({
        accession_id: accId.get(it.accession_number), item_qualifier: it.item_qualifier,
        location_code: it.location_code, bed: it.bed, sub_location: it.sub_location,
        location_ref: it.location_ref, specimen_count: it.specimen_count, in_latest_export: true,
      })), { onConflict: "accession_id,item_qualifier" });
      saved.forEach((r) => savedPlantingIds.add(r.id));
      plDone += batch.length;
      tick(`Saved ${plDone.toLocaleString()} of ${items.length.toLocaleString()} plantings`);
    }
    written.push(`${plDone.toLocaleString()} plantings saved`);

    const missingPl = state.data.plantings.filter((p) => p.in_latest_export && !savedPlantingIds.has(p.id)).map((p) => p.id);
    for (const ids of chunk(missingPl, ID_BATCH)) await db.update("plantings", { id: { in: ids } }, { in_latest_export: false });
    if (missingPl.length) written.push(`${missingPl.length} plantings flagged as not in this export`);
    tick("Replacing the IrisBG source mirror…");

    await db.remove("source_records", { source: "irisbg" });
    written.push("Old IrisBG source rows removed");
    let srcDone = 0;
    for (const batch of chunk(items, WRITE_BATCH)) {
      await db.insert("source_records", batch.map((it) => ({ source: "irisbg", source_id: it.full, plant_name: it.plant_name, details: it.raw })), { returning: false });
      srcDone += batch.length;
      tick(`Mirrored ${srcDone.toLocaleString()} of ${items.length.toLocaleString()} IrisBG rows`);
    }
    written.push(`${srcDone.toLocaleString()} IrisBG source rows saved`);

    await reloadTables("accessions", "plantings", "irisbg_imports");
    // source_records changed only for 'irisbg'; refetch just those rows.
    const iris = DEMO ? await db.select("source_records", { source: "irisbg" }) : await liveDb.select("source_records", { source: "irisbg" });
    state.data.source_records = state.data.source_records.filter((r) => r.source !== "irisbg").concat(iris);
    if (!DEMO) idbSet(cacheKey("source_records"), state.data.source_records);
    buildIndex();
    st.phase = "done";
  } catch (e) {
    st.phase = "failed";
    st.error = e.message;
  }
  render();
}

function renderImportScreen() {
  const st = state.importState;
  const picker = `<label class="btn primary" style="display:inline-block">Choose IrisBG export (.xlsx)<input type="file" id="iris-file" accept=".xlsx" hidden></label>`;
  if (!st) {
    return `<p class="muted">Upload the IrisBG report. Nothing is saved until you've seen the preview and confirmed.</p>${picker}
      <p class="faint">Columns are read in this order: ${IRIS_FIELDS.join(", ")}.</p>`;
  }
  if (st.phase === "reading") return `<p>Reading <strong>${esc(st.fileName)}</strong>…</p>`;
  if (st.phase === "error") return `<div class="notice bad">Couldn't read ${esc(st.fileName)}: ${esc(st.error)}</div>${picker}`;
  if (st.phase === "preview") {
    const { plan } = st;
    const stat = (n, l) => `<div class="stat"><div class="n">${Number(n).toLocaleString()}</div><div class="l">${esc(l)}</div></div>`;
    return `<h3 class="page-title" style="font-size:19px">Preview: ${esc(st.fileName)}</h3>
      <p class="muted">${st.rowsRead.toLocaleString()} rows read · ${plan.parsed.items.length.toLocaleString()} plant items in ${plan.accs.size.toLocaleString()} accessions · columns mapped by ${esc(plan.parsed.mappedBy)}</p>
      <h4>Accessions</h4><div class="stat-grid">${stat(plan.acc.new, "new")}${stat(plan.acc.changed, "changed")}${stat(plan.acc.unchanged, "unchanged")}${stat(plan.acc.missing, "not in this file (will be flagged)")}</div>
      <h4>Plantings (items)</h4><div class="stat-grid">${stat(plan.pl.new, "new")}${stat(plan.pl.changed, "changed")}${stat(plan.pl.unchanged, "unchanged")}${stat(plan.pl.missing, "not in this file (will be flagged)")}</div>
      ${plan.conflicts.length ? `<div class="notice">${plan.conflicts.length} accession(s) have items with different plant names; the first name is used.<details><summary>Show</summary><div class="faint">${plan.conflicts.slice(0, 100).map(esc).join("<br>")}</div></details></div>` : ""}
      ${plan.parsed.bad.length ? `<div class="notice bad">${plan.parsed.bad.length} row(s) can't be imported and will be skipped.<details><summary>Show</summary><div class="faint">${plan.parsed.bad.slice(0, 100).map((b) => `Row ${b.rowNo}: ${esc(b.reason)}`).join("<br>")}</div></details></div>` : ""}
      <div class="notice good">Status, GPS points and notes on existing plantings are never changed by an import, and nothing is deleted.</div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" data-action="run-import">Import ${plan.parsed.items.length.toLocaleString()} items</button><button class="btn" data-action="cancel-import">Cancel</button></div>`;
  }
  if (st.phase === "writing") {
    return `<h3>Importing ${esc(st.fileName)}…</h3><div class="progress"><div id="import-bar"></div></div><p class="faint" id="import-progress-label">Starting…</p><p class="faint">Keep this tab open until it finishes.</p>`;
  }
  const log = (st.written || []).map((w) => `<li>${esc(w)}</li>`).join("");
  if (st.phase === "failed") {
    return `<div class="notice bad"><strong>The import stopped part-way:</strong> ${esc(st.error)}</div>
      <p>What was written before it stopped:</p><ul>${log || "<li>Nothing.</li>"}</ul>
      <p class="muted">Re-running the same file is safe: accessions and plantings are matched by number, so it picks up where this left off.</p>${picker}`;
  }
  return `<div class="notice good">Import complete.</div><ul>${log}</ul><button class="btn" data-action="cancel-import">Import another file</button>`;
}

/* ==================== GARDEN LOCATIONS ====================
   Bed and sub-area codes come from IrisBG ("H", "H-W", "ESH-CB"). Staff
   give each a real name here; sub-areas default their parent to the bed
   they were seen under.
   ========================================================= */
function renderLocations() {
  const counts = new Map();
  for (const pl of state.data.plantings) {
    for (const [code, parent] of [[pl.bed, null], [pl.sub_location, pl.bed]]) {
      if (!code) continue;
      const e = counts.get(code) || { code, parent, n: 0 };
      e.n++;
      counts.set(code, e);
    }
  }
  const named = new Map(state.data.garden_locations.map((g) => [g.code, g]));
  for (const g of state.data.garden_locations) if (!counts.has(g.code)) counts.set(g.code, { code: g.code, parent: g.parent_code, n: 0 });
  const list = [...counts.values()].sort((a, b) => String(a.parent || a.code).localeCompare(String(b.parent || b.code), undefined, { numeric: true }) || (a.parent ? 1 : 0) - (b.parent ? 1 : 0) || a.code.localeCompare(b.code, undefined, { numeric: true }));
  if (!list.length) return `<h1 class="page-title">Garden locations</h1><div class="empty">Location codes appear here after the first IrisBG import.</div>`;
  const unnamed = list.filter((l) => !(named.get(l.code) || {}).name).length;
  return `<h1 class="page-title">Garden locations</h1>
    <p class="muted">${list.length} codes from IrisBG · ${unnamed} still need a name. Names save when you leave the field.</p>
    <div class="table-wrap"><table class="sheet"><thead><tr><th>Code</th><th>Within</th><th>Plantings</th><th>Name</th><th>Notes</th></tr></thead><tbody>
    ${list.map((l) => { const g = named.get(l.code) || {}; return `<tr><td><strong>${esc(l.code)}</strong></td><td>${esc(g.parent_code || l.parent || "")}</td><td>${l.n}</td>
      <td><input class="input" data-loc="${attr(l.code)}" data-parent="${attr(g.parent_code || l.parent || "")}" data-col="name" value="${attr(g.name || "")}" placeholder="e.g. Entry Garden"></td>
      <td><input class="input" data-loc="${attr(l.code)}" data-parent="${attr(g.parent_code || l.parent || "")}" data-col="notes" value="${attr(g.notes || "")}"></td></tr>`; }).join("")}
    </tbody></table></div>`;
}

async function saveLocation(input) {
  const code = input.dataset.loc;
  const g = state.data.garden_locations.find((x) => x.code === code) || {};
  const value = norm(input.value);
  if ((g[input.dataset.col] || null) === value) return;
  const parent = input.dataset.parent || null;
  try {
    // A sub-area's parent must exist first (foreign key), so make sure it does.
    if (parent && !state.data.garden_locations.some((x) => x.code === parent)) await db.insert("garden_locations", [{ code: parent }], { onConflict: "code", returning: false });
    await db.insert("garden_locations", [{ code, parent_code: parent, name: g.name || null, notes: g.notes || null, [input.dataset.col]: value }], { onConflict: "code", returning: false });
    await reloadTables("garden_locations");
    toast(`Saved ${code}.`);
  } catch (e) { toast(`Couldn't save ${code}: ${e.message}`, true); }
}

/* ==================== ADMIN: PICKLISTS, STAFF, IMPORT HISTORY ==================== */
const LIST_LABELS = { plant_type: "Plant type", light_needs: "Light needs", water_needs: "Water needs", blooming_season: "Blooming season" };
const LIST_COLUMN = { plant_type: "plant_type", light_needs: "light_needs", water_needs: "water_needs", blooming_season: "blooming_season" };

function renderAdmin() {
  if (!state.me?.is_admin) return `<div class="empty">Admins only.</div>`;
  const tabs = [["import", "IrisBG import"], ["history", "Import history"], ["changes", "Change history"], ["picklists", "Picklists"], ["staff", "Staff"]];
  const body = { import: renderImportScreen, history: renderImportHistory, changes: renderChangeExport, picklists: renderPicklists, staff: renderStaff }[state.adminTab] || renderImportScreen;
  return `<h1 class="page-title">Admin</h1>
    <div class="seg" style="margin:6px 0 16px">${tabs.map(([t, l]) => `<button class="${state.adminTab === t ? "active" : ""}" data-action="admin-tab" data-tab="${t}">${l}</button>`).join("")}</div>${body()}`;
}

function renderImportHistory() {
  const list = [...state.data.irisbg_imports].sort((a, b) => String(b.imported_at).localeCompare(String(a.imported_at)));
  if (!list.length) return `<div class="empty">No IrisBG imports yet.</div>`;
  return `<div class="table-wrap"><table class="sheet"><thead><tr><th>When</th><th>File</th><th>By</th><th>Summary</th></tr></thead><tbody>
    ${list.map((i) => `<tr><td>${esc(fmtDateTime(i.imported_at))}</td><td>${esc(i.file_name)}</td><td>${esc(shortEmail(i.imported_by))}</td>
      <td class="faint">${Object.entries(i.summary || {}).map(([k, v]) => `${esc(k.replace(/_/g, " "))}: ${esc(v)}`).join(" · ")}</td></tr>`).join("")}</tbody></table></div>`;
}

function taxaUsing(list, value) {
  const col = LIST_COLUMN[list];
  return state.data.taxa.filter((t) => (Array.isArray(t[col]) ? t[col].includes(value) : t[col] === value));
}

function renderPicklists() {
  return Object.entries(LIST_LABELS).map(([list, label]) => {
    const opts = state.data.list_options.filter((o) => o.list === list).sort((a, b) => a.sort - b.sort || a.value.localeCompare(b.value));
    return `<div class="box"><h3 style="font-family:var(--serif);margin:0 0 8px">${label}</h3>
      ${opts.map((o, i) => { const used = taxaUsing(list, o.value).length; return `<div class="row-between" style="padding:3px 0">
        <input class="input" style="max-width:280px" data-rename-list="${list}" data-old="${attr(o.value)}" value="${attr(o.value)}">
        <span class="faint">${used ? `used by ${used}` : "unused"}</span>
        <span><button class="btn small" data-action="move-opt" data-list="${list}" data-value="${attr(o.value)}" data-dir="-1" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="btn small" data-action="move-opt" data-list="${list}" data-value="${attr(o.value)}" data-dir="1" ${i === opts.length - 1 ? "disabled" : ""}>↓</button>
          <button class="btn small danger" data-action="delete-opt" data-list="${list}" data-value="${attr(o.value)}" ${used ? `disabled title="In use — rename it instead"` : ""}>Delete</button></span></div>`; }).join("")}
      <form class="row-between" data-add-opt="${list}" style="margin-top:6px;justify-content:flex-start"><input class="input" style="max-width:280px" name="value" placeholder="Add a value"><button class="btn small">Add</button></form>
    </div>`;
  }).join("");
}

async function addOption(form) {
  const list = form.dataset.addOpt;
  const value = norm(new FormData(form).get("value"));
  if (!value) return;
  const max = state.data.list_options.filter((o) => o.list === list).reduce((m, o) => Math.max(m, o.sort), 0);
  try { await db.insert("list_options", [{ list, value, sort: max + 1 }], { returning: false }); await reloadTables("list_options"); renderMain(); }
  catch (e) { toast(`Couldn't add: ${e.message}`, true); }
}

// Renaming updates every curated record using the old value first, so no
// taxon is left pointing at a value that no longer exists.
async function renameOption(input) {
  const list = input.dataset.renameList, old = input.dataset.old, value = norm(input.value);
  if (!value || value === old) { input.value = old; return; }
  const col = LIST_COLUMN[list];
  const users = taxaUsing(list, old);
  if (users.length && !confirmAction(`Rename “${old}” to “${value}”? ${plural(users.length, "curated record")} will be updated.`)) { input.value = old; return; }
  try {
    const o = state.data.list_options.find((x) => x.list === list && x.value === old);
    await db.insert("list_options", [{ list, value, sort: o ? o.sort : 0 }], { returning: false });
    for (const t of users) {
      const next = Array.isArray(t[col]) ? t[col].map((v) => (v === old ? value : v)) : value;
      await db.update("taxa", { id: t.id }, { [col]: next });
    }
    await db.remove("list_options", { list, value: old });
    await reloadTables("list_options", "taxa");
    toast(`Renamed to “${value}”.`);
    renderMain();
  } catch (e) { toast(`Couldn't rename: ${e.message}`, true); input.value = old; }
}

async function moveOption(list, value, dir) {
  const opts = state.data.list_options.filter((o) => o.list === list).sort((a, b) => a.sort - b.sort || a.value.localeCompare(b.value));
  const i = opts.findIndex((o) => o.value === value), j = i + dir;
  if (i < 0 || j < 0 || j >= opts.length) return;
  [opts[i], opts[j]] = [opts[j], opts[i]];
  try {
    await Promise.all(opts.map((o, k) => db.update("list_options", { list, value: o.value }, { sort: k + 1 })));
    await reloadTables("list_options"); renderMain();
  } catch (e) { toast(`Couldn't reorder: ${e.message}`, true); }
}

async function deleteOption(list, value) {
  if (taxaUsing(list, value).length) return;
  try { await db.remove("list_options", { list, value }); await reloadTables("list_options"); renderMain(); }
  catch (e) { toast(`Couldn't delete: ${e.message}`, true); }
}

function renderStaff() {
  const list = [...state.data.staff].sort((a, b) => a.email.localeCompare(b.email));
  return `<p class="muted">People on this list can sign in — with Google, or with a password once they've accepted an invitation. Adding someone here doesn't email them; use Invite.</p>
    <div class="table-wrap"><table class="sheet"><thead><tr><th>Email</th><th>Name</th><th>Admin</th><th>Added</th><th></th></tr></thead><tbody>
    ${list.map((s) => `<tr><td>${esc(s.email)}</td><td>${esc(s.display_name || "")}</td>
      <td><input type="checkbox" data-action="toggle-admin" data-email="${attr(s.email)}" ${s.is_admin ? "checked" : ""} ${s.email === state.me.email ? "disabled title='You can’t change your own admin role'" : ""}></td>
      <td class="faint">${esc(fmtDate(s.added_at))}${s.added_by ? ` by ${esc(shortEmail(s.added_by))}` : ""}</td>
      <td style="white-space:nowrap"><button class="btn small" data-action="invite-staff" data-email="${attr(s.email)}">Invite</button>
        ${s.email === state.me.email ? "" : ` <button class="btn small danger" data-action="remove-staff" data-email="${attr(s.email)}">Remove</button>`}</td></tr>`).join("")}
    </tbody></table></div>
    <form id="add-staff" class="box" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input class="input" style="max-width:260px" name="email" type="email" placeholder="name@example.org" required>
      <input class="input" style="max-width:200px" name="display_name" placeholder="Name (optional)">
      <label><input type="checkbox" name="is_admin"> Admin</label>
      <button class="btn primary">Add staff member</button></form>`;
}

// Calls the invite-staff Edge Function, which holds the admin key. Any
// mail failure (the built-in Supabase mailer only reaches project members
// and allows a few per hour) comes back as a message, not a silent nothing.
async function inviteStaff(email, btn) {
  if (DEMO) { toast("Demo mode sends no email."); return; }
  if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
  try {
    const res = await authedFetch(`${CONFIG.SUPABASE_URL}/functions/v1/invite-staff`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, redirect_to: appUrl() }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    toast(data.sent === "reset" ? `${email} already had an account — sent a password-reset email.` : `Invitation sent to ${email}.`);
  } catch (e) {
    toast(`Couldn't invite ${email}: ${e.message}`, true);
  }
  if (btn) { btn.disabled = false; btn.textContent = "Invite"; }
}

async function addStaff(form) {
  const f = new FormData(form);
  const email = String(f.get("email") || "").trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast("Enter a valid email address.", true); return; }
  try {
    await db.insert("staff", [{ email, display_name: norm(f.get("display_name")), is_admin: !!f.get("is_admin"), added_by: state.me.email }], { returning: false });
    await reloadTables("staff"); renderMain();
    toast(`${email} added. Click Invite to email them a set-password link.`);
  } catch (e) { toast(`Couldn't add: ${e.message}`, true); }
}

/* ==================== EVENTS ====================
   One delegated listener per event type. Elements declare what they do
   with data-action; forms are identified by id or data attribute.
   ================================================ */
let searchTimer = null;

function refreshMergeResults() {
  const p = selectedPlant();
  const box = document.getElementById("merge-results");
  if (p && box) box.innerHTML = renderMergeResults(p);
}

function selectPlant(key) {
  if (state.selectedKey !== key) { state.mergeQuery = ""; state.mergePicks.clear(); state.editingPlanting = null; state.nameSuggestions = null; }
  state.selectedKey = key;
  renderPanel();
  document.querySelectorAll(".card.selected, tr.selected").forEach((el) => el.classList.remove("selected"));
  document.querySelectorAll(`[data-action="select"][data-key="${CSS.escape(key)}"]`).forEach((el) => { if (el.matches(".card, tr")) el.classList.add("selected"); });
  const panel = document.getElementById("panel");
  if (panel) panel.scrollTop = 0;
}

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (el.tagName === "A" && a !== "lightbox") ev.preventDefault();
  switch (a) {
    case "sign-in": signInWithProvider(el.dataset.provider || "google"); break;
    case "forgot-password": requestPasswordReset(); break;
    case "invite-staff": inviteStaff(el.dataset.email, el); break;
    case "sign-out": signOut(); break;
    case "retry": boot(); break;
    case "view": state.view = el.dataset.view; render(); window.scrollTo(0, 0); break;
    case "mode": state.browse.mode = el.dataset.mode; state.browse.limit = el.dataset.mode === "gallery" ? GALLERY_PAGE : SHEET_PAGE; renderMain(); break;
    case "more": state.browse.limit += state.browse.mode === "gallery" ? GALLERY_PAGE : SHEET_PAGE; renderMain(); break;
    case "reset-filters": Object.assign(state.browse, { q: "", source: "", genus: "", family: "", curated: "", gap: "", sort: "name" }); render(); break;
    case "select": selectPlant(el.dataset.key); break;
    case "close-panel": state.selectedKey = null; render(); break;
    case "next-plant": {
      const list = state.lastList && state.lastList.length ? state.lastList : state.idx.list.map((p) => p.key);
      const i = list.indexOf(resolveKey(state.selectedKey));
      selectPlant(list[(i + 1) % list.length]);
      break;
    }
    case "tab": state.tab = el.dataset.tab; renderPanel(); break;
    case "lightbox": openLightbox(el.dataset.src); break;
    case "close-lightbox": document.getElementById("overlay").innerHTML = ""; break;
    case "use-sugg": useSuggestion(el); break;
    case "delete-taxon": deleteTaxon(); break;
    case "edit-planting": state.editingPlanting = state.editingPlanting === Number(el.dataset.id) ? null : Number(el.dataset.id); renderPanel(); break;
    case "merge": mergePlants([el.dataset.alias], el.dataset.keep); break;
    case "merge-picks": mergePlants([...state.mergePicks], el.dataset.keep); break;
    case "clear-picks": state.mergePicks.clear(); refreshMergeResults(); break;
    case "merge-group": mergeGroup(el.dataset.scope); break;
    case "cancel-combine": state.view = state.combine?.back || "duplicates"; state.combine = null; render(); break;
    case "not-dup-group": notDupGroup(Number(el.dataset.group)); break;
    case "not-dup-member": notDupMember(Number(el.dataset.group), el.dataset.key); break;
    case "unmerge": unmerge(el.dataset.alias); break;
    case "more-dupes": state.dupLimit += 25; renderMain(); break;
    case "suggest-names": suggestNames(el.dataset.key, el); break;
    case "count-changes": countChangeExport(); break;
    case "export-changes": runChangeExport(); break;
    case "reset-change-export": state.changeExport = { from: "", to: "", who: "", area: "", op: "", q: "", count: null, busy: false, status: null, error: null }; renderMain(); break;
    case "dash-tile": state.dashTile = el.dataset.tile; state.dashLimit = 100; renderMain(); document.getElementById("dash-list")?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    case "more-dash": state.dashLimit += 100; refreshDashList(); break;
    case "clear-dash-filters": state.dashFilters = { ...DASH_FILTER_DEFAULTS }; state.dashLimit = 100; renderMain(); break;
    case "admin-tab": state.adminTab = el.dataset.tab; renderMain(); break;
    case "run-import": runIrisImport(); break;
    case "cancel-import": state.importState = null; renderMain(); break;
    case "move-opt": moveOption(el.dataset.list, el.dataset.value, Number(el.dataset.dir)); break;
    case "delete-opt": deleteOption(el.dataset.list, el.dataset.value); break;
    case "toggle-admin": {
      const email = el.dataset.email;
      try { await db.update("staff", { email }, { is_admin: el.checked }); await reloadTables("staff"); toast(`${email} is ${el.checked ? "now" : "no longer"} an admin.`); }
      catch (e) { el.checked = !el.checked; toast(`Couldn't change: ${e.message}`, true); }
      break;
    }
    case "remove-staff": {
      const email = el.dataset.email;
      if (!confirmAction(`Remove ${email}? They won't be able to sign in.`)) break;
      try { await db.remove("staff", { email }); await reloadTables("staff"); renderMain(); }
      catch (e) { toast(`Couldn't remove: ${e.message}`, true); }
      break;
    }
    default: break;
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "search") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.browse.q = t.value;
      state.browse.limit = state.browse.mode === "gallery" ? GALLERY_PAGE : SHEET_PAGE;
      if (state.view !== "browse") { state.view = "browse"; render(); document.getElementById("search")?.focus(); }
      else renderMain();
    }, 180);
  } else if (t.id === "dash-q") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.dashFilters.q = t.value; state.dashLimit = 100; refreshDashList(); }, 180);
  } else if (t.id === "change-export-q") {
    state.changeExport.q = t.value;
    state.changeExport.count = null;
  } else if (t.id === "dup-search") {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.dupQuery = t.value;
      state.dupLimit = 25;
      // Swap only the list so the search box keeps focus and caret.
      const tmp = document.createElement("div");
      tmp.innerHTML = renderDuplicates();
      const list = document.getElementById("dup-list");
      if (list) list.replaceWith(tmp.querySelector("#dup-list"));
    }, 180);
  } else if (t.id === "merge-search") {
    state.mergeQuery = t.value;
    refreshMergeResults();
  } else if (t.closest && t.closest("#curated-form")) {
    // A hand edit after "Use" makes the value typed-in unless it still
    // matches the suggestion exactly (checked again at save time).
    const holder = t.dataset.field ? t : t.closest("[data-field]");
    if (holder) holder.classList.add("dirty");
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.dashf) {
    state.dashFilters[t.dataset.dashf] = t.value;
    state.dashLimit = 100;
    renderMain();
  } else if (t.dataset.changeExport) {
    state.changeExport[t.dataset.changeExport] = t.value;
    state.changeExport.count = null;
    state.changeExport.status = null;
    renderMain();
  } else if (t.dataset.filter) {
    state.browse[t.dataset.filter] = t.value;
    state.browse.limit = state.browse.mode === "gallery" ? GALLERY_PAGE : SHEET_PAGE;
    renderMain();
  } else if (t.dataset.mergePick) {
    if (t.checked) state.mergePicks.add(t.dataset.mergePick); else state.mergePicks.delete(t.dataset.mergePick);
    refreshMergeResults();
  } else if (t.id === "iris-file" && t.files && t.files[0]) {
    handleIrisFile(t.files[0]);
  } else if (t.dataset.loc) {
    saveLocation(t);
  } else if (t.dataset.renameList) {
    renameOption(t);
  } else if (t.dataset.multi || (t.closest && t.closest("#curated-form"))) {
    const holder = t.dataset.field ? t : t.closest("[data-field]");
    if (holder) holder.classList.add("dirty");
  }
});

document.addEventListener("submit", (ev) => {
  const f = ev.target;
  if (f.id === "login-form") { ev.preventDefault(); signInWithPassword(f); }
  else if (f.id === "password-form") { ev.preventDefault(); setPassword(f); }
  else if (f.id === "curated-form") { ev.preventDefault(); saveCurated(f); }
  else if (f.id === "combine-form") { ev.preventDefault(); saveCombine(f); }
  else if (f.id === "planting-form") { ev.preventDefault(); savePlanting(f); }
  else if (f.id === "add-staff") { ev.preventDefault(); addStaff(f); }
  else if (f.dataset.addOpt) { ev.preventDefault(); addOption(f); }
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    if (document.querySelector(".lightbox")) document.getElementById("overlay").innerHTML = "";
    else if (state.selectedKey && !ev.target.closest("input, textarea, select")) { state.selectedKey = null; render(); }
  }
});

/* ==================== BOOT ==================== */
async function loadMe() {
  const rows = await liveDb.select("staff", { email: state.session.email });
  return rows[0] || null;
}

async function boot() {
  state.error = null;
  state.dashFilters = state.dashFilters || { ...DASH_FILTER_DEFAULTS };
  if (DEMO) {
    try {
      const res = await fetch("demo-data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("demo-data.json not found — demo mode needs the local snapshot.");
      demoDb.store = await res.json();
      for (const t of TABLES) demoDb.store[t] = demoDb.store[t] || [];
      state.me = { email: "demo@local", display_name: "Demo", is_admin: true };
      await loadAll();
      state.phase = "ready";
    } catch (e) { state.phase = "error"; state.error = e.message; }
    render();
    return;
  }
  const redirect = consumeAuthRedirect();
  if (redirect && redirect.error) { state.phase = "login"; state.error = `Google sign-in failed: ${redirect.error}`; render(); return; }
  if (redirect && redirect.session) saveSession(redirect.session);
  state.session = (redirect && redirect.session) || loadStoredSession();
  if (!state.session) { state.phase = "login"; render(); return; }
  // An invite or reset link signs the person in with a one-time token; make
  // them choose a password before anything else, or they can never sign in
  // again without another email.
  if (redirect && (redirect.type === "invite" || redirect.type === "recovery")) state.pendingPassword = true;
  if (state.pendingPassword) { state.phase = "setpassword"; render(); return; }
  try {
    await ensureFreshSession();
    if (!state.session) { state.phase = "login"; render(); return; }
    // RLS only returns your own staff row if you're on the list, so an
    // empty result means "signed in, not staff".
    state.me = await loadMe();
    if (!state.me) { state.phase = "notstaff"; render(); return; }
    await loadAll();
    state.phase = "ready";
  } catch (e) {
    state.phase = "error";
    state.error = e.message;
  }
  render();
}

boot();
